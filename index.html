<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Overload">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12110F">
<meta name="description" content="Calisthenics, weights and hybrid training tracker.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Overload</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --push:#5E86A8; --pull:#5E86A8; --legs:#5E86A8; --core:#5E86A8; --full:#5E86A8; --cond:#5E86A8;
  --bg:#12110F; --surface:#161513; --card:#1A1916; --card2:#211F1B;
  --border:#221F1C; --border2:#37342E;
  --text:#F2F0EB; --muted:#8C877D; --dim:#7A7469;
  --accent:#5E86A8; --accent-dim:rgba(94,134,168,.14); --accent-border:rgba(94,134,168,.42);
  --cream:#F2F0EB;
  --nav-w:230px;
  --r-sm:8px; --r:10px; --r-md:12px; --r-lg:16px; --r-xl:22px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);min-height:100vh;font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:0;height:0}
h1,h2,h3{font-family:'Instrument Sans',sans-serif;font-weight:700;letter-spacing:-.6px}
h1{letter-spacing:-1.1px}
input,textarea,button,select{font-family:inherit;-webkit-appearance:none;appearance:none}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
textarea{resize:none}
@media(max-width:639px){*{touch-action:manipulation}html,body{overscroll-behavior:none}}

.app{max-width:480px;margin:0 auto;padding-bottom:84px;min-height:100vh}

.nav-logo{display:none}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:rgba(18,17,15,.96);backdrop-filter:blur(16px) saturate(160%);
  border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:10px 4px 14px;background:transparent;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--dim);transition:color .15s}
.nav button span.icon{width:21px;height:21px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav button span.icon svg{width:100%;height:100%}
.nav button span.lbl{font-size:10px;font-weight:600;letter-spacing:.2px}
.nav button .dot{display:none}
.nav[data-tab="today"] #nb-today,
.nav[data-tab="train"] #nb-train,
.nav[data-tab="progress"] #nb-progress{color:var(--text)}

@media(min-width:640px){
  html,body{height:100%;overflow:hidden}
  .app{max-width:none;margin:0;padding-bottom:0;padding-left:var(--nav-w);height:100vh;overflow:hidden}
  #page{height:100vh;overflow-y:auto;overflow-x:hidden;max-width:820px;padding-bottom:48px;scroll-behavior:smooth}
  .nav{position:fixed;left:0;top:0;bottom:0;width:var(--nav-w);max-width:var(--nav-w);
    flex-direction:column;justify-content:flex-start;align-items:stretch;transform:none;
    border-top:none;border-right:1px solid var(--border);background:var(--surface);backdrop-filter:none;padding:30px 0 0}
  .nav button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;padding:12px 22px;gap:12px;
    border-radius:0;font-size:13px;border-left:2px solid transparent;transition:background .15s,color .15s}
  .nav button:hover{background:var(--card2)}
  .nav button span.icon{width:18px;height:18px;opacity:.8}
  .nav button span.lbl{font-size:13.5px;font-weight:600}
  .nav[data-tab="today"] #nb-today,
  .nav[data-tab="train"] #nb-train,
  .nav[data-tab="progress"] #nb-progress{color:var(--text);background:var(--accent-dim);border-left-color:var(--accent)}
  .nav-logo{display:block;padding:0 22px 24px;border-bottom:1px solid var(--border);margin-bottom:10px}
  .nav-logo div{font-weight:700;font-size:16px;color:var(--text);letter-spacing:-.3px}
  .nav-logo p{font-size:11px;color:var(--dim);margin-top:2px}
  .modal-content{max-width:580px}
  .stat-grid-desktop{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat-grid-desktop .card{margin-bottom:0 !important}
}
@media(min-width:1000px){#page{max-width:960px}}

.page{padding:0 18px 26px}
.ph{padding:22px 18px 14px}
.ph .eyebrow{font-size:10px;letter-spacing:1.8px;font-weight:600;margin-bottom:7px;text-transform:uppercase;color:var(--muted)}
.ph h1{font-size:30px;line-height:1;margin:0}
.ph p{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.6;text-wrap:pretty}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px}
.card+.card{margin-top:10px}

.slabel{font-size:10px;letter-spacing:1.6px;color:var(--dim);font-weight:600;margin-bottom:11px;text-transform:uppercase}
.eyebrow{font-size:10px;letter-spacing:1.8px;font-weight:600;text-transform:uppercase}

.btn{display:block;width:100%;white-space:nowrap;padding:15px 16px;border:none;border-radius:var(--r-md);
  background:var(--cream);color:#12110F;font-weight:700;font-size:14.5px;letter-spacing:-.1px;
  cursor:pointer;text-align:center;transition:opacity .15s,transform .1s}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.985)}
.btn.secondary{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:600;padding:11px 16px}
.btn.secondary:hover{border-color:var(--border2);color:var(--text)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}

.input{width:100%;padding:13px 14px;background:transparent;border:1px solid var(--border);
  border-radius:var(--r-md);color:var(--text);font-size:14px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--accent-border)}
.input::placeholder{color:var(--dim)}

.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.pill-row.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.pill{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;
  color:var(--muted);font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s}
.pill:hover{border-color:var(--border2);color:var(--text)}
.pill.active{border-color:var(--accent-border);background:var(--accent-dim);color:var(--accent)}
.pill.sm{padding:6px 12px;font-size:11.5px}

.subtabs{display:flex;border-bottom:1px solid var(--border);padding:0 18px}
.subtab{flex:1;padding:12px 4px;background:transparent;border:none;border-bottom:1.5px solid transparent;
  color:var(--dim);font-weight:600;font-size:12px;cursor:pointer;letter-spacing:.2px;transition:color .15s,border-color .15s}
.subtab.active{color:var(--text);border-bottom-color:var(--text)}

.ex-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-md);padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s}
.ex-row:hover{border-color:var(--border2);background:var(--card2)}
.ex-row .cat-badge{width:34px;height:34px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ex-row h3{font-size:13.5px;margin:0;font-weight:600;letter-spacing:0}
.ex-row p{font-size:11px;color:var(--muted);margin:0;font-weight:400}

.dots{display:flex;gap:4px;align-items:center}
.dots span{width:5px;height:5px;border-radius:50%;background:var(--border2)}
.dots span.on{background:var(--ac,var(--accent))}

.list-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-md);padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s}
.list-row:hover{border-color:var(--border2);background:var(--card2)}
.list-row h3{font-size:13.5px;margin:0;font-weight:600;letter-spacing:0}
.list-row p{font-size:11px;color:var(--muted);margin:0;font-weight:400}

.prog-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:10px}
.prog-card .icon{width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prog-card h3{font-size:15.5px;margin:0;font-weight:600;letter-spacing:-.2px}
.prog-card p{font-size:12px;color:var(--muted);line-height:1.55;margin:9px 0;text-wrap:pretty}

.day-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:13px 14px;
  display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .15s}
.day-card .icon{width:40px;height:40px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.day-card .name{font-weight:700;font-size:16px;letter-spacing:-.3px}
.day-card .sub{font-size:12px;font-weight:500;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-card .badge{font-size:9.5px;font-weight:600;letter-spacing:1px;padding:2px 7px;border-radius:6px}

.edit-panel{background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--r-lg) var(--r-lg);padding:15px}

.stat-grid{display:flex;gap:9px}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 11px;flex:1;text-align:center}
.stat-box .val{font-size:25px;font-weight:700;line-height:1;letter-spacing:-1px}
.stat-box .lbl{font-size:9px;letter-spacing:1.2px;color:var(--dim);margin-top:4px;text-transform:uppercase;font-weight:600}

.prog-bar-wrap{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-bar{height:4px;border-radius:2px;transition:width .4s ease}

.set-badge{background:var(--set-bg,var(--accent-dim));border:1px solid var(--set-bd,var(--accent-border));
  border-radius:var(--r-sm);padding:8px 10px;text-align:center;min-width:52px}
.set-badge .rv{font-size:18px;font-weight:700;line-height:1;letter-spacing:-.5px}
.set-badge .rl{font-size:9px;color:var(--dim);font-weight:600;letter-spacing:.6px;margin-top:2px}

.rpe-btn{flex:1;padding:10px 0;border-radius:var(--r-sm);border:1px solid var(--border);background:transparent;
  color:var(--muted);font-weight:600;font-size:11.5px;cursor:pointer;transition:all .15s}
.rpe-btn.active{border-color:var(--rpe,var(--accent));background:var(--accent-dim);color:var(--rpe,var(--accent))}

.ex-preview-row{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-md);padding:11px 13px;margin-bottom:8px}
.ex-num{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:600;flex-shrink:0}

.custom-ex-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-md);padding:11px 13px;margin-bottom:8px}
.ctr-btn{width:30px;height:30px;border-radius:var(--r-sm);background:transparent;border:1px solid var(--border);
  color:var(--text);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;
  transition:background .15s,border-color .15s;flex-shrink:0}
.ctr-btn:hover{border-color:var(--border2)}

.rest-box{border-radius:var(--r-lg);padding:16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.rest-time{font-size:52px;font-weight:700;line-height:1;letter-spacing:-2.5px}

.track-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;
  background:var(--bg);position:sticky;top:0;z-index:10}
.back-btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:var(--r-sm);
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;
  flex-shrink:0;transition:border-color .15s,color .15s}
.back-btn:hover{border-color:var(--border2);color:var(--text)}

.modal-overlay{position:fixed;inset:0;background:rgba(8,8,7,.82);z-index:300;overflow-y:auto;backdrop-filter:blur(6px)}
.modal-content{background:var(--card);margin:52px auto 0;border-radius:var(--r-xl) var(--r-xl) 0 0;min-height:80vh;
  max-width:480px;border:1px solid var(--border);border-bottom:none;padding-bottom:60px}
.modal-header{padding:20px 20px 15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;
  align-items:flex-start;position:sticky;top:0;background:var(--card);z-index:1;border-radius:var(--r-xl) var(--r-xl) 0 0}
.modal-header h2{font-size:23px;margin:0;line-height:1.1}
.close-btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:var(--r-sm);
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;
  flex-shrink:0;transition:border-color .15s,color .15s}
.close-btn:hover{border-color:var(--border2);color:var(--text)}
.modal-body{padding:18px 20px}

.svgbar{display:block}
.bar-chart{margin-top:4px}
</style>
</head>
<body>
<div class="app" id="app">
  <div id="page"></div>
  <nav class="nav" id="nav" data-tab="today">
    <div class="nav-logo"><div>Overload</div><p>Train · Progress · Repeat</p></div>
    <button id="nb-today" onclick="goTab('today')">
      <span class="icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14M10 7v3l2.5 1.5"/></svg></span>
      <span class="lbl">Today</span>
    </button>
    <button id="nb-train" onclick="goTab('train')">
      <span class="icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h2m10 0h2M6 6v8m8-8v8M6 10h8"/></svg></span>
      <span class="lbl">Train</span>
    </button>
    <button id="nb-progress" onclick="goTab('progress')">
      <span class="icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l4-5 3 3 5-7M3 17h14"/></svg></span>
      <span class="lbl">Progress</span>
    </button>
  </nav>
</div>
<div id="exmodal" style="display:none"></div>
<script>
/* ══════════════════════════════════════
   DATA
══════════════════════════════════════ */
const C={push:'#5E86A8',pull:'#5E86A8',legs:'#5E86A8',core:'#5E86A8',full:'#5E86A8',cond:'#5E86A8'};
const CL={push:'Push',pull:'Pull',legs:'Legs',core:'Core',full:'Full Body',cond:'Conditioning'};
const LVL=['Beginner','Intermediate','Advanced','Elite'];
const LVLC=['#84A8C4','#5E86A8','#4A6E8C','#3E5D77'];
const RPEL=['','Easy','Moderate','Hard','Max'];
const RPEC=['#3A3630','#84A8C4','#5E86A8','#41637F','#B0524F'];
const _ic=(d,s,c)=>`<svg width="${s||17}" height="${s||17}" viewBox="0 0 20 20" fill="none" stroke="${c||'#5E86A8'}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const EMOJ={
  push:_ic('M4 14h12M10 4v7M7 7l3-3 3 3'),
  pull:_ic('M4 6h12M10 16V9M7 12l3 3 3-3'),
  legs:_ic('M7 3v5l4.5 3.5L9 17'),
  core:_ic('M5 5h10M6.5 10h7M5 15h10'),
  full:_ic('M5 5h3v3H5zM12 5h3v3h-3zM5 12h3v3H5zM12 12h3v3h-3z'),
  cond:_ic('M3 7h6M3 11h9M3 15h5M13 5l4 5-4 5')
};
const RESTIC=_ic('M4 10h12',17,'var(--dim)');
const BUILDIC=_ic('M4 16V8l6-4 6 4v8M8 16v-5h4v5',16);
const TROPHYIC=_ic('M4 10.5 8 14.5l8-9',34);
const CHEVD=_ic('M6 8.5l4 4 4-4',14,'var(--dim)');
const CHEVU=_ic('M6 11.5l4-4 4 4',14,'var(--dim)');

const EX={
  pushup:{n:'Push-Up',c:'push',d:1,e:'None',m:'Chest · Triceps · Delts',desc:'The king of pressing. Master this before anything harder.',steps:['Hands slightly wider than shoulders, body straight head to heel','Lower chest to floor, elbows at 45°','Push up explosively, squeeze chest at top','Core and glutes tight throughout'],mistakes:['Flaring elbows wide','Sagging hips','Not touching chest to floor'],ez:'Knee Push-Up',hr:'Archer Push-Up'},
  wide_pu:{n:'Wide Push-Up',c:'push',d:1,e:'None',m:'Outer Chest · Delts',desc:'Hands much wider — hits outer chest and pec stretch at the bottom.',steps:['Hands 1.5-2x shoulder width','Lower with elbows tracking out','Chest between hands at bottom','Push back up'],mistakes:['Going too wide causing shoulder strain','Not getting full depth'],ez:'Push-Up',hr:'Archer Push-Up'},
  diamond_pu:{n:'Diamond Push-Up',c:'push',d:2,e:'None',m:'Triceps · Inner Chest',desc:'Hands close in a diamond. Destroys the triceps.',steps:['Hands under chest forming a diamond','Lower with elbows tucked close to sides','Push back up squeezing triceps'],mistakes:['Elbows flaring out','Hands too far forward'],ez:'Close-Grip Push-Up',hr:'Close-Grip Archer'},
  pike_pu:{n:'Pike Push-Up',c:'push',d:2,e:'None',m:'Shoulders · Triceps',desc:'Hips high, head toward floor — the path to handstand push-ups.',steps:['Downward dog position, hips high','Lower head toward floor between hands','Push up driving through shoulders','Keep hips high throughout'],mistakes:['Hips dropping (becomes a push-up)','Not going low enough'],ez:'Push-Up',hr:'Elevated Pike Push-Up'},
  elevated_pike_pu:{n:'Elevated Pike Push-Up',c:'push',d:2,e:'Chair / Bench',m:'Shoulders · Triceps · Upper Chest',desc:'Feet elevated on a chair or couch with hips high. More load on the shoulders than flat pike — the bridge between pike push-ups and wall handstand push-ups.',steps:['Place feet on chair or low surface, hands on floor shoulder width','Drive hips high to form an inverted V','Lower head toward floor, elbows tracking slightly out','Push back up through the shoulders'],mistakes:['Hips dropping mid-rep','Elbows flaring too wide','Not going deep enough'],ez:'Pike Push-Up',hr:'Wall Handstand Push-Up'},
  decline_pu:{n:'Decline Push-Up',c:'push',d:2,e:'Bench',m:'Upper Chest · Shoulders',desc:'Feet elevated — shifts load to upper chest and front delts.',steps:['Feet on elevated surface, hands on floor','Body in a straight line','Lower chest toward floor, push back up','Higher feet = harder, more shoulder work'],mistakes:['Sagging hips','Too steep before ready'],ez:'Push-Up',hr:'Pike Push-Up'},
  dips:{n:'Dips',c:'push',d:2,e:'Parallel Bars',m:'Chest · Triceps · Shoulders',desc:'One of the best upper body exercises at the park. Lean forward for chest, upright for triceps.',steps:['Grip parallel bars, arms straight','Lower until upper arms parallel to floor','Push back up fully extending arms','Lean forward for chest, stay upright for triceps'],mistakes:['Not going low enough','Shrugging shoulders','Swinging legs'],ez:'Bench Dip',hr:'Ring Dips'},
  archer_pu:{n:'Archer Push-Up',c:'push',d:3,e:'None',m:'Chest · Triceps',desc:'One arm does most work while the other guides. Serious one-arm progression.',steps:['Very wide push-up position','Lower to one side — bend that arm fully, keep other straight','Push back up through bent arm','Alternate sides'],mistakes:['Rotating hips','Not extending the assisting arm'],ez:'Wide Push-Up',hr:'One-Arm Push-Up'},
  explosive_pu:{n:'Explosive Push-Up',c:'push',d:2,e:'None',m:'Chest · Triceps · Power',desc:'Push up so hard your hands leave the ground. Builds upper body power.',steps:['Start in push-up position','Lower to floor','Drive up as hard as possible','Land softly and repeat'],mistakes:['Not fully extending arms','Landing stiff-armed'],ez:'Push-Up',hr:'Clap Push-Up'},
  pseudo_planche:{n:'Pseudo Planche Push-Up',c:'push',d:3,e:'None',m:'Chest · Front Delts',desc:'Hands backward, leaning forward. Builds planche foundations and serious front delt strength.',steps:['Push-up position, fingers pointing toward feet','Lean forward so shoulders ahead of wrists','Do push-up reps from this position','More lean = harder'],mistakes:['Not leaning enough','Skipping wrist warm-up'],ez:'Push-Up',hr:'Tuck Planche'},
  handstand_hold:{n:'Freestanding Handstand Hold',c:'push',d:3,timed:true,e:'Floor',m:'Shoulders · Balance · Core',desc:'Kick up to a freestanding handstand and hold. Almost entirely a balance skill once you have the strength — daily short sessions beat weekly long ones.',steps:['Hands shoulder-width, one foot steps forward','Kick back leg up, follow with front, find the balance point over your hands','Make small corrections with your fingertips','Eyes on a spot on the floor between your hands'],mistakes:['Overcorrecting instead of small adjustments','Holding your breath','Inconsistent daily practice'],ez:'Wall Handstand Hold',hr:'Wall Handstand Push-Up'},
  wall_hspu:{n:'Wall Handstand Push-Up',c:'push',d:4,e:'Wall',m:'Shoulders · Triceps',desc:'Kick into handstand against wall and do vertical push-ups. Elite shoulder strength.',steps:['Kick up into wall handstand, hands 6 inches from wall','Lower head toward floor in a controlled manner','Push back up to full lockout','Keep core tight'],mistakes:['Too much lower back arch','Hands too far from wall'],ez:'Pike Push-Up',hr:'Freestanding HSPU'},
  dead_hang:{n:'Dead Hang',c:'pull',d:1,timed:true,e:'Pull-Up Bar',m:'Grip · Forearms · Shoulders',desc:'Just hanging. Builds grip strength, decompresses spine. Never skip.',steps:['Jump and grab bar with both hands','Relax completely — let body hang','Breathe deeply throughout','Build up to 60 second holds'],mistakes:['Shrugging shoulders','Letting go too soon'],ez:'Partial hang',hr:'One-Arm Dead Hang'},
  scap_pu:{n:'Scapular Pull-Up',c:'pull',d:1,e:'Pull-Up Bar',m:'Rhomboids · Lower Traps · Lats',desc:'Foundation of healthy pull mechanics. Retract shoulder blades — no elbow bend.',steps:['Hang from bar in a dead hang','Without bending elbows, pull shoulder blades DOWN and BACK','Feel lats engage and body rise slightly','Lower back to full relaxed hang'],mistakes:['Bending elbows','Shrugging up instead of pulling down'],ez:'Dead Hang',hr:'Pull-Up'},
  australian_row:{n:'Australian Row',c:'pull',d:1,e:'Low Bar',m:'Lats · Rear Delts · Biceps',desc:'Inverted rows under a low bar. Perfect before pull-ups.',steps:['Lie under low bar, grip overhand','Body straight from head to heels','Pull chest up to bar, squeeze shoulder blades','Lower slowly. More horizontal = harder'],mistakes:['Bending at hips','Not bringing chest to bar'],ez:'Inclined Row',hr:'Pull-Up'},
  neg_pullup:{n:'Negative Pull-Up',c:'pull',d:1,e:'Pull-Up Bar',m:'Lats · Biceps · Rear Delts',desc:'Jump to top, lower as slowly as possible. Best method to build pull-up strength.',steps:['Jump to get chin above bar','Lower yourself as slowly as possible — aim for 5 seconds','Drop off at the bottom and reset'],mistakes:['Dropping fast','Not starting from true top'],ez:'Australian Row',hr:'Pull-Up'},
  pullup:{n:'Pull-Up',c:'pull',d:2,e:'Pull-Up Bar',m:'Lats · Biceps · Rear Delts',desc:'Single best back exercise. Non-negotiable.',steps:['Overhand grip just outside shoulder width','Pull until chin clearly over bar, drive elbows toward hips','Lower slowly to a full dead hang','Zero kipping or momentum'],mistakes:['Kipping/using momentum','Not reaching full dead hang','Chin not clearing bar'],ez:'Negative Pull-Up',hr:'Archer Pull-Up'},
  chinup:{n:'Chin-Up',c:'pull',d:2,e:'Pull-Up Bar',m:'Biceps · Lats · Lower Chest',desc:'Underhand grip — easier than pull-ups, hits biceps much harder. Best for arm size.',steps:['Underhand grip, hands shoulder-width','Pull until chin over bar, squeeze biceps at top','Lower slowly through full range'],mistakes:['Narrow grip limiting range','Not squeezing at top'],ez:'Negative Pull-Up',hr:'Close-Grip Chin-Up'},
  close_chinup:{n:'Close-Grip Chin-Up',c:'pull',d:2,e:'Pull-Up Bar',m:'Biceps · Brachialis',desc:'Hands touching — extreme bicep activation. If you want bigger arms, include this.',steps:['Hands touching or 2 inches apart, underhand','Pull up with elbows close to body','Squeeze hard at top','Lower fully'],mistakes:['Elbows flaring','Partial range'],ez:'Chin-Up',hr:'One-Arm Chin-Up'},
  commando_pu:{n:'Commando Pull-Up',c:'pull',d:3,e:'Pull-Up Bar',m:'Lats · Biceps · Obliques',desc:'Hands side-by-side, alternating sides. Great for lat width and core rotation.',steps:['Grip bar with hands side-by-side','Pull up so head goes to one side','Lower, then pull to other side','Alternate each rep'],mistakes:['Not going high enough','Twisting whole body'],ez:'Pull-Up',hr:'Archer Pull-Up'},
  typewriter_pu:{n:'Typewriter Pull-Up',c:'pull',d:3,e:'Pull-Up Bar',m:'Lats · Biceps · Core',desc:'Pull up to one side, slide across, lower on the other. Killer lat builder.',steps:['Pull up to right side of bar','Shift weight and slide across to left','Lower on the left side','Reverse next rep'],mistakes:['Not getting high enough','Rushing the movement'],ez:'Pull-Up',hr:'Archer Pull-Up'},
  archer_pullup:{n:'Archer Pull-Up',c:'pull',d:4,e:'Pull-Up Bar',m:'Lats · Biceps · Core',desc:'One arm does all the work while the other stays straight. Path to one-arm pull-ups.',steps:['Wide overhand grip','Pull toward one hand keeping other arm straight','Working arm takes full load','Alternate sides'],mistakes:['Bending the straight arm','Not getting chin over working hand'],ez:'Typewriter Pull-Up',hr:'One-Arm Pull-Up'},
  squat:{n:'Bodyweight Squat',c:'legs',d:1,e:'None',m:'Quads · Glutes · Hamstrings',desc:'Foundation of all leg training. Perfect this before making it harder.',steps:['Feet shoulder-width, toes slightly out','Sit back and down, chest up, knees over toes','Thighs at least parallel to floor','Drive through heels to stand'],mistakes:['Knees caving in','Heels lifting','Not going deep enough'],ez:'Box Squat',hr:'Bulgarian Split Squat'},
  lunge:{n:'Walking Lunge',c:'legs',d:1,e:'None',m:'Quads · Glutes · Hamstrings',desc:'Classic lunge stepping forward. Great for quads, glutes, and balance.',steps:['Step forward, drop back knee toward floor','Front knee above ankle, chest upright','Push off back foot, step forward, repeat other side'],mistakes:['Knee caving in','Step too short'],ez:'Static Lunge',hr:'Bulgarian Split Squat'},
  rev_lunge:{n:'Reverse Lunge',c:'legs',d:1,e:'None',m:'Quads · Glutes · Hamstrings',desc:'Step backward — easier on the knee joint, more glute activation.',steps:['Stand upright','Step one foot back and drop that knee toward floor','Front knee stays over ankle','Push through front heel to return'],mistakes:['Front knee shooting forward','Not going deep enough'],ez:'Squat',hr:'Bulgarian Split Squat'},
  bulgarian:{n:'Bulgarian Split Squat',c:'legs',d:2,e:'Bench',m:'Quads · Glutes · Hamstrings',desc:'Single best bodyweight leg exercise. Brutal but builds serious mass.',steps:['Rear foot on bench 2 feet behind you','Lower back knee toward floor, front knee tracks over toes','Drive through front heel to stand','All reps one side then switch'],mistakes:['Front foot too close (knee past toes)','Torso collapsing forward'],ez:'Reverse Lunge',hr:'Pistol Squat'},
  glute_bridge:{n:'Glute Bridge',c:'legs',d:1,e:'None',m:'Glutes · Hamstrings',desc:'Most underrated posterior chain exercise for calisthenics athletes.',steps:['Lie on back, knees bent, feet hip-width','Drive hips up squeezing glutes hard','Hold at top — straight line shoulder to knee','Lower slowly and repeat'],mistakes:['Pushing through lower back not glutes','Not holding at top'],ez:'Static glute squeeze',hr:'Single-Leg Glute Bridge'},
  singleleg_bridge:{n:'Single-Leg Glute Bridge',c:'legs',d:2,e:'None',m:'Glutes · Hamstrings · Core',desc:'One leg version — doubles load on each glute. Fixes imbalances.',steps:['Lie on back, one knee bent, other leg straight up','Drive hips up through planted foot, squeezing glute','Straight line shoulder to knee','Hold then lower slowly'],mistakes:['Hips twisting or dropping','Not fully extending at top'],ez:'Glute Bridge',hr:'Elevated Single-Leg Bridge'},
  jump_squat:{n:'Jump Squat',c:'legs',d:2,e:'None',m:'Quads · Glutes · Power',desc:'Explosive power training. Develops fast-twitch muscle fibres.',steps:['Squat down to parallel','Explode upward as fast as possible','Land softly with bent knees','Immediately drop into next squat'],mistakes:['Landing on straight legs','Not squatting deep first'],ez:'Squat',hr:'Tuck Jump'},
  calf_raise:{n:'Single-Leg Calf Raise',c:'legs',d:1,e:'Step',m:'Calves · Soleus',desc:'Full range single-leg on a step — only effective bodyweight calf exercise.',steps:['One foot on step edge, heel hanging off','Lower heel as far as possible — full stretch','Rise up as high as possible — full contraction','All reps one leg then switch'],mistakes:['Partial range','Both legs (too easy)'],ez:'Both-leg calf raise',hr:'Pause at bottom each rep'},
  nordic_curl:{n:'Nordic Curl',c:'legs',d:3,e:'Bar/Anchor',m:'Hamstrings · Glutes',desc:'Feet anchored, body lowering forward. Biggest hamstring strength gains of any exercise.',steps:['Kneel with feet anchored under a bar','Body upright, arms by sides','Lower body forward slowly using hamstrings','Use hands to push off floor at bottom and pull back up'],mistakes:['Dropping too fast (eccentric is the whole point)','Hips flexing instead of body falling'],ez:'Glute Bridge',hr:'Unassisted lowering'},
  pistol_prog:{n:'Pistol Squat Progression',c:'legs',d:4,e:'Optional support',m:'Quads · Glutes · Stability',desc:'The ultimate bodyweight leg exercise. One-legged squat to full depth.',steps:['Hold a bar for balance (reduce reliance over time)','Extend one leg forward','Lower on standing leg as deep as possible','Drive up through standing heel'],mistakes:['Attempting without strength base','Heel rising'],ez:'Bulgarian Split Squat',hr:'Freestanding Pistol Squat'},
  plank:{n:'Plank',c:'core',d:1,timed:true,e:'None',m:'Core · Abs · Obliques',desc:'Foundation of core training. Squeeze everything before chasing time.',steps:['Forearms on floor, elbows under shoulders','Straight line head to heels','Squeeze: abs, glutes, quads, fists','Breathe steadily'],mistakes:['Raised hips','Sagging hips','Not squeezing anything'],ez:'Incline Plank',hr:'Hollow Body Hold'},
  side_plank:{n:'Side Plank',c:'core',d:1,timed:true,e:'None',m:'Obliques · Core',desc:'Essential lateral core stability. Obliques are neglected by most.',steps:['Lie on side, forearm under shoulder, feet stacked','Lift hips forming a straight diagonal line','Hold, breathe steadily','Switch sides'],mistakes:['Hips sagging','Shoulder rolling forward'],ez:'Bent-knee side plank',hr:'Side plank with hip dip'},
  hollow_body:{n:'Hollow Body Hold',c:'core',d:2,timed:true,e:'None',m:'Deep Core · Abs · Hip Flexors',desc:'Most important core exercise in calisthenics. Underpins every advanced skill.',steps:['Lie on back, press lower back completely into floor','Raise legs and shoulders simultaneously','Arms overhead — lower legs = harder','Hold the compression and breathe'],mistakes:['Lower back arching off floor','Holding breath','Legs too low too soon'],ez:'Tuck Hollow Hold',hr:'Hollow Body Rocks'},
  lying_leg_raise:{n:'Lying Leg Raise',c:'core',d:1,e:'None',m:'Lower Abs · Hip Flexors',desc:'Lie on back and raise straight legs. Focus on keeping lower back flat.',steps:['Lie flat, hands under lower back','Legs straight, raise to vertical','Lower slowly — stop before lower back lifts','Raise again immediately'],mistakes:['Lower back arching','Bending knees to cheat'],ez:'Bent-knee raises',hr:'Hanging Leg Raise'},
  leg_raise:{n:'Hanging Leg Raise',c:'core',d:2,e:'Pull-Up Bar',m:'Lower Abs · Hip Flexors · Grip',desc:'Hanging from bar, raise legs to parallel or above. Outstanding lower ab builder.',steps:['Hang from bar with firm grip','Raise legs straight to parallel or above','Lower slowly — no swinging'],mistakes:['Swinging for momentum','Bending knees to cheat'],ez:'Lying Leg Raise',hr:'Toes-to-Bar'},
  mountain_climber:{n:'Mountain Climber',c:'cond',d:1,e:'None',m:'Core · Shoulders · Hip Flexors',desc:'Dynamic core work that doubles as cardio. Great finisher.',steps:['High plank position, core tight','Drive one knee toward chest','Quickly switch legs','Keep hips level'],mistakes:['Hips bouncing','Not fully extending leg back'],ez:'Slow version',hr:'Cross-body Mountain Climber'},
  bicycle_crunch:{n:'Bicycle Crunch',c:'core',d:1,e:'None',m:'Abs · Obliques',desc:'Highest-rated ab exercise in studies. Combines rotation with crunch.',steps:['Lie on back, hands behind head lightly','Bring right elbow to left knee as you extend right leg','Switch continuously'],mistakes:['Pulling neck with hands','Rushing without rotation'],ez:'Crunches',hr:'Slow tempo bicycle crunch'},
  l_sit:{n:'L-Sit Progression',c:'core',d:3,timed:true,e:'Parallel Bars',m:'Core · Hip Flexors · Triceps',desc:'Hold body with legs raised to parallel on bars. True test of combined strength.',steps:['Support on parallel bars or fists on floor','Tuck knees to chest first — master 10 second hold','Extend one leg, then both','Arms stay straight, depress shoulders'],mistakes:['Bent elbows','Shrugging shoulders','Jumping to full extension too soon'],ez:'Tuck L-Sit',hr:'L-Sit to V-Sit'},
  v_sit_hold:{n:'V-Sit Hold',c:'core',d:3,timed:true,e:'Parallettes / Floor',m:'Core · Hip Flexors · Triceps',desc:'Legs raised well above parallel until the body forms a tight V. The direct next tier past the full L-sit.',steps:['Set up in a full L-sit on parallettes','Drive both legs up above parallel, torso staying upright','Keep arms straight, shoulders depressed','Hold, breathe normally'],mistakes:['Leaning torso back to cheat the angle','Knees bending to fake the height'],ez:'L-Sit Progression',hr:'Straddle Planche'},
  dragon_flag:{n:'Dragon Flag',c:'core',d:4,e:'Bench',m:'Core · Abs · Shoulders',desc:'Entire body rigid like a plank, hinging only at shoulders. Elite core exercise.',steps:['Lie on bench, grip it overhead behind head','Raise body to vertical supported on upper back','Lower body in one rigid unit — do NOT let hips bend','Go as low as possible while keeping body straight'],mistakes:['Hips bending (most common mistake)','Going too fast on descent'],ez:'Tucked Dragon Flag',hr:'Full Dragon Flag'},
  burpee:{n:'Burpee',c:'cond',d:2,e:'None',m:'Full Body · Cardio',desc:'The most complete conditioning exercise. Hits everything.',steps:['Stand upright','Drop hands to floor, jump feet back to push-up position','Do a push-up (optional)','Jump feet toward hands, then jump up with arms overhead'],mistakes:['Sloppy form at bottom','Not fully extending at top of jump'],ez:'Step-out Burpee',hr:'Burpee Pull-Up'},
  shrimp_squat:{n:'Shrimp Squat',c:'legs',d:2,e:'None',m:'Quads · Glutes · Stability',desc:'Hold rear foot, squat to floor on one leg. The natural bridge between Bulgarian split squat and pistol squat.',steps:['Stand on one leg, grip same-side ankle behind you','Squat down, letting rear knee touch floor gently','Drive back up through front heel','Keep torso upright throughout'],mistakes:['Torso collapsing forward','Not reaching full depth','Front knee caving in'],ez:'Bulgarian Split Squat',hr:'Pistol Squat'},
  front_lever:{n:'Front Lever Progression',c:'pull',d:3,e:'Pull-Up Bar',m:'Lats · Core · Rear Delts · Biceps',desc:'Horizontal hold from bar with body straight. One of the best lat and core exercises in calisthenics. Work through tuck, advanced tuck, straddle progressions.',steps:['Hang from bar, pull shoulders down and back','Tuck knees to chest and raise hips until body is horizontal','Hold position, progressing to legs extended over time','Maintain hollow body throughout'],mistakes:['Hips dropping','Shoulders not engaged','Rushing to full before tuck is solid'],ez:'Tuck Front Lever',hr:'Straddle or full front lever'},
  ab_wheel:{n:'Ab Wheel Rollout',c:'core',d:2,e:'Ab Wheel',m:'Deep Core · Abs · Lats · Shoulders',desc:'Roll out from kneeling, return under control. One of the most effective core exercises in existence.',steps:['Kneel with wheel in front of you','Roll forward slowly while keeping core braced','Extend as far as you can without lower back arching','Pull back to start using abs and lats'],mistakes:['Lower back arching','Using momentum to return','Going too far before ready'],ez:'Half rollout',hr:'Standing ab wheel rollout'},
  tuck_planche:{n:'Tuck Planche Hold',c:'push',d:3,e:'Parallettes',m:'Shoulders · Chest · Core · Triceps',desc:'Lean forward until horizontal, knees tucked. The first real planche skill. Direct progression from planche lean.',steps:['On parallettes, lean forward with protracted scapula','Tuck knees to chest','Lift feet off ground until body horizontal','Hold as long as possible, aiming for 5-10 second holds'],mistakes:['Not protracting scapula','Hips not staying up','Bent arms'],ez:'Planche Lean',hr:'Advanced tuck planche'},
  box_jump:{n:'Box Jump',c:'cond',d:2,e:'Bench/Box',m:'Quads · Glutes · Power',desc:'Jump onto an elevated surface. Develops explosive leg power.',steps:['Stand in front of bench','Hinge at hips and swing arms back','Explode up, land softly on box with bent knees','Stand fully, then step back down'],mistakes:['Landing with straight legs','Not landing in squat position'],ez:'Jump Squat',hr:'Higher box'},
  bear_crawl:{n:'Bear Crawl',c:'cond',d:2,e:'None',m:'Shoulders · Core · Quads',desc:'All fours with knees hovering. Develops coordination, shoulder stability.',steps:['Hands and knees, lift knees 2 inches off floor','Move right hand and left foot forward','Then left hand and right foot','Flat back and hovering knees throughout'],mistakes:['Hips rising up','Same-side hand and foot together'],ez:'Crawling on knees',hr:'With resistance band'},
  broad_jump:{n:'Broad Jump',c:'cond',d:2,e:'None',m:'Quads · Glutes · Power',desc:'Horizontal explosive jump — trains athletic power.',steps:['Feet shoulder-width','Hinge at hips, swing arms back','Swing forward and jump as far as possible','Land with bent knees in solid squat'],mistakes:['Landing stiff','Not using arm swing'],ez:'Jump Squat',hr:'Single-leg broad jump'},
  sprint:{n:'Sprint Interval',c:'cond',d:2,e:'None',m:'Legs · Cardio · Full Body',desc:'Short maximal effort sprints. Most effective cardio for fat loss.',steps:['Mark out 20-40 metres','Sprint at maximum effort','Walk back for recovery','Repeat for prescribed rounds'],mistakes:['Not going truly max effort','Insufficient rest between sprints'],ez:'Jog',hr:'Hill sprints'},
  band_lat_raise:{n:'Band Lateral Raise',c:'push',d:0,e:'Resistance Band',m:'Side Delts · Traps',desc:'Band under foot, raise arms to sides. Isolates the lateral head of the deltoid for shoulder width.',steps:['Stand on band, one in each hand','Arms at sides, slight bend in elbows','Raise arms out to sides until parallel with ground','Lower slowly under control'],mistakes:['Using momentum','Shrugging shoulders up','Going above shoulder height'],ez:'Lighter band',hr:'Heavier band or pause at top'},
  band_tri_push:{n:'Band Tricep Pushdown',c:'push',d:0,e:'Resistance Band',m:'Triceps',desc:'Anchor band overhead, push down to full extension. Pure tricep isolation.',steps:['Anchor band high (door or pull-up bar)','Grip band with both hands, elbows pinned to sides','Push hands down to full extension','Slowly let hands return to 90°'],mistakes:['Elbows flaring out','Using bodyweight to push down'],ez:'Lighter band',hr:'Heavier band or single arm'},
  band_face_pull:{n:'Band Face Pull',c:'pull',d:0,e:'Resistance Band',m:'Rear Delts · Upper Traps · Rotator Cuff',desc:'Pull band to face level, elbows high. The most important band exercise for shoulder health and rear delt development.',steps:['Anchor band at face height','Grip band with thumbs up','Pull to face, leading with elbows high and wide','External rotate so hands end beside ears'],mistakes:['Pulling to neck instead of face','Elbows dropping low'],ez:'Lighter band',hr:'Heavier band or slow eccentric'},
  band_row:{n:'Band Seated Row',c:'pull',d:0,e:'Resistance Band',m:'Mid Back · Rhomboids · Biceps',desc:'Sit with band looped around feet, row to waist. Builds mid-back thickness.',steps:['Sit with legs extended, loop band around feet','Grip both ends, sit upright with slight lean back','Row hands to sides of waist, squeezing shoulder blades','Return slowly'],mistakes:['Rounding the back','Using arm strength only'],ez:'Shorter range of motion',hr:'Heavier band or single arm'},
  band_curl:{n:'Band Bicep Curl',c:'pull',d:0,e:'Resistance Band',m:'Biceps',desc:'Stand on band, curl to full contraction. Consistent tension through full range.',steps:['Stand on band, one end in each hand','Arms at sides, palms forward','Curl hands to shoulders, squeeze at top','Lower slowly all the way down'],mistakes:['Swinging body back','Not lowering fully'],ez:'Lighter band',hr:'Heavier band or concentration curls'},
  band_rdelt:{n:'Band Rear Delt Fly',c:'pull',d:0,e:'Resistance Band',m:'Rear Delts · Rhomboids',desc:'Cross bands and pull apart at shoulder height. Targets the rear deltoid directly.',steps:['Cross two bands in front of you or use one','Hold both ends at chest height, arms slightly bent','Pull arms apart and back until fully spread','Squeeze shoulder blades together, hold 1s'],mistakes:['Arms too straight','Shrugging instead of pulling back'],ez:'Lighter band',hr:'Heavier band or single arm'},
  band_ohp:{n:'Band Overhead Press',c:'push',d:0,e:'Resistance Band',m:'Shoulders · Triceps · Upper Traps',desc:'Stand on band, press overhead. Great shoulder builder with no equipment needed.',steps:['Stand on band, hold at shoulder height','Press straight up to full arm extension','Lower back to shoulders under control'],mistakes:['Arching lower back','Not locking out at top'],ez:'Lighter band',hr:'Heavier band or single arm'},
  band_chest_fly:{n:'Band Chest Fly',c:'push',d:0,e:'Resistance Band',m:'Chest · Anterior Delts',desc:'Anchor behind you, fly arms together. Chest isolation from resistance bands.',steps:['Anchor band behind at chest height','Step forward with slight lean','Arms out to sides with slight elbow bend','Bring hands together in front, squeezing chest','Return slowly'],mistakes:['Bending elbows too much','Going too far back on eccentric'],ez:'Lighter band',hr:'Heavier band or lower anchor point'},
  band_hammer_curl:{n:'Band Hammer Curl',c:'pull',d:0,e:'Resistance Band',m:'Biceps · Brachialis · Forearms',desc:'Neutral grip curl with band. Builds the brachialis for arm thickness.',steps:['Stand on band, arms at sides with palms facing each other','Keep thumbs pointing up throughout','Curl to shoulders, maintain neutral grip','Lower fully'],mistakes:['Rotating to supinated grip','Swinging body'],ez:'Lighter band',hr:'Heavier band or single arm'},
  band_pull_apart:{n:'Band Pull-Apart',c:'pull',d:0,e:'Resistance Band',m:'Rear Delts · Upper Back · Rotator Cuff',desc:'Hold band at shoulder height and pull apart with straight arms. Essential for shoulder health, posture and rear delt development. Every push session should have a pull-apart to balance the joint.',steps:['Hold band with both hands shoulder-width apart, arms straight in front','Pull the band apart by driving elbows back and squeezing shoulder blades','Control the return slowly — do not let it snap back','Keep arms parallel to floor throughout'],mistakes:['Bending elbows','Using too light a band','Letting the band snap back uncontrolled'],ez:'Wider grip on band',hr:'Narrower grip or heavier band'},
  planche_lean:{n:'Planche Lean on Parallettes',c:'push',d:2,e:'Parallettes',m:'Shoulders · Chest · Core',desc:'Lean forward on parallettes, body at angle. Builds the strength base for full planche.',steps:['Grips on parallettes, arms straight','Protract scapula (push shoulders apart)','Lean forward until shoulders are over or past hands','Hold position, body straight'],mistakes:['Bending elbows','Not protracting scapula','Sagging hips'],ez:'Pseudo Planche Push-Up',hr:'Longer lean duration or tucked planche'},
  neutral_pullup:{n:'Neutral Grip Pull-Up',c:'pull',d:1,e:'Pull-Up Bar',m:'Lats · Biceps · Brachialis',desc:'Pull-up with palms facing each other. Easier on elbows and wrists, great for thick back development.',steps:['Hang with palms facing each other','Pull until chin over bar','Lower slowly with control'],mistakes:['Kipping or swinging','Not full ROM'],ez:'Assisted or jumping negatives',hr:'Add weight or L-sit pull-up'},
  tuck_fl:{n:'Tuck Front Lever',c:'pull',d:2,timed:true,e:'Pull-Up Bar',m:'Lats · Core · Shoulders',desc:'First real front lever progression — knees tucked to chest, back flat, body horizontal. The entry point to the front lever line.',steps:['Hang from bar, pull shoulder blades down and back','Tuck knees to chest and lean back until back is flat/horizontal','Push down hard into the bar, squeeze glutes to keep the line straight','Hold, then lower with control'],mistakes:['Hips sagging below the shoulder line','Bent arms — must stay locked out'],ez:'Support hold or shorter negatives',hr:'Advanced Tuck Front Lever'},

  /* ── WEIGHTED / GYM EXERCISES ── */
  barbell_bench:{n:'Barbell Bench Press',c:'push',d:2,weighted:true,e:'Barbell + Bench',m:'Chest · Triceps · Front Delts',desc:'The core horizontal press. Foundation of upper-body pushing strength and mass.',steps:['Lie on bench, grip just wider than shoulder-width','Unrack, lower bar to mid-chest with control','Press back up to full lockout, elbows not fully flared'],mistakes:['Bouncing bar off chest','Flaring elbows to 90°','Feet not planted'],ez:'Dumbbell Bench Press (lighter start)',hr:'Add weight or slow the eccentric'},
  db_shoulder_press:{n:'Dumbbell Shoulder Press',c:'push',d:2,weighted:true,e:'Dumbbells',m:'Shoulders · Triceps',desc:'Seated or standing overhead press. Builds shoulder size and pressing strength beyond what bodyweight pike work can reach.',steps:['Dumbbells at shoulder height, palms forward','Press straight overhead to lockout','Lower under control to shoulder height'],mistakes:['Arching lower back excessively','Not going through full range'],ez:'Lighter dumbbells or seated with back support',hr:'Standing strict press, no leg drive'},
  incline_db_press:{n:'Incline Dumbbell Press',c:'push',d:2,weighted:true,e:'Dumbbells + Incline Bench',m:'Upper Chest · Front Delts',desc:'Incline angle shifts emphasis to upper chest — fills a gap flat pressing and bodyweight push work both miss.',steps:['Bench at 30-45°, dumbbells at chest height','Press up and slightly in, full lockout','Lower with control to a stretch'],mistakes:['Bench angle too steep (becomes a shoulder press)','Not controlling the descent'],ez:'Lower the incline angle',hr:'Increase weight or angle'},
  cable_tricep_pushdown:{n:'Cable Tricep Pushdown',c:'push',d:1,weighted:true,e:'Cable Machine',m:'Triceps',desc:'Isolation finisher for triceps. Good accessory after the big compound presses.',steps:['Grip attachment at chest height, elbows pinned to sides','Push down to full extension','Control back up, elbows stay fixed'],mistakes:['Elbows drifting forward','Using body momentum'],ez:'Lighter weight, focus on form',hr:'Single-arm version'},
  barbell_row:{n:'Barbell Row',c:'pull',d:2,weighted:true,e:'Barbell',m:'Lats · Rhomboids · Rear Delts · Biceps',desc:'The main horizontal pulling movement in a gym. Builds back thickness that pull-ups alone can\'t.',steps:['Hinge at hips, torso near-parallel to floor, flat back','Pull bar to lower ribs, elbows driving back','Lower with control, maintain hip hinge throughout'],mistakes:['Standing too upright (turns into a shrug)','Rounding the lower back','Using momentum to heave the weight'],ez:'Chest-supported row',hr:'Add weight or pause at top'},
  lat_pulldown:{n:'Lat Pulldown',c:'pull',d:1,weighted:true,e:'Cable Machine',m:'Lats · Biceps',desc:'Machine-based vertical pull. Good volume tool alongside pull-ups, especially useful when pull-up sets are already near failure.',steps:['Grip slightly wider than shoulders, sit tall','Pull bar to upper chest, drive elbows down and back','Control the return to full stretch'],mistakes:['Leaning back excessively to use body weight','Not achieving full stretch at top'],ez:'Lighter weight, focus on lat squeeze',hr:'Single-arm lat pulldown'},
  db_row:{n:'Single-Arm Dumbbell Row',c:'pull',d:1,weighted:true,e:'Dumbbell + Bench',m:'Lats · Rhomboids · Biceps',desc:'Unilateral row — fixes side-to-side imbalances and lets you really squeeze each rep.',steps:['One knee and hand on bench, flat back','Row dumbbell to hip, elbow driving back and up','Lower with control to full stretch'],mistakes:['Rotating the torso to cheat the weight up','Not achieving full stretch'],ez:'Lighter dumbbell',hr:'Add weight or slow tempo'},
  barbell_curl:{n:'Barbell Curl',c:'pull',d:1,weighted:true,e:'Barbell',m:'Biceps · Forearms',desc:'Direct bicep mass builder — arms respond well to dedicated isolation on top of your pulling volume.',steps:['Stand tall, shoulder-width grip, elbows pinned to sides','Curl to shoulders without swinging','Lower with control to full extension'],mistakes:['Swinging the torso to cheat the weight up','Elbows drifting forward'],ez:'Lighter weight or dumbbells',hr:'Add weight or slow eccentric'},
  weighted_pullup:{n:'Weighted Pull-Up',c:'pull',d:3,weighted:true,e:'Pull-Up Bar + Weight Belt/Vest',m:'Lats · Biceps · Grip',desc:'Your bodyweight pull-up with extra load strapped on. The direct bridge between calisthenics and gym-style progressive overload.',steps:['Attach weight via belt, vest, or a dumbbell held between feet','Full dead hang start, pull chin over bar','Lower with control to full extension'],mistakes:['Using added weight before bodyweight form is solid','Kipping to compensate for the extra load'],ez:'Drop the added weight',hr:'Add more weight'},
  barbell_squat:{n:'Barbell Back Squat',c:'legs',d:2,weighted:true,e:'Barbell + Rack',m:'Quads · Glutes · Core',desc:'The single highest-leverage exercise for adding leg mass — external load your bodyweight squats structurally can\'t match.',steps:['Bar on upper traps, feet shoulder-width','Break at hips and knees together, sit down and back','Descend to at least parallel, drive back up through mid-foot'],mistakes:['Knees caving inward','Heels lifting off the floor','Not hitting depth'],ez:'Goblet squat with a dumbbell',hr:'Add weight or pause at the bottom'},
  deadlift:{n:'Conventional Deadlift',c:'legs',d:3,weighted:true,e:'Barbell',m:'Hamstrings · Glutes · Back · Grip',desc:'Loads the entire posterior chain at once. Arguably the single best mass-and-strength builder available, bar none.',steps:['Bar over mid-foot, grip just outside legs','Flat back, chest up, hinge at hips to grip the bar','Drive through the floor, bar stays close to body, lock out hips and knees together'],mistakes:['Rounding the lower back','Bar drifting away from the shins','Hyperextending at lockout'],ez:'Reduce weight, groove the hip hinge pattern first',hr:'Add weight or pause below the knee'},
  leg_press:{n:'Leg Press',c:'legs',d:1,weighted:true,e:'Leg Press Machine',m:'Quads · Glutes',desc:'Machine-based quad and glute builder. Lets you push heavy volume with less technical demand and fatigue than a squat.',steps:['Feet shoulder-width on platform, back flat against pad','Lower until knees reach roughly 90°','Press back up without locking knees out hard'],mistakes:['Letting knees cave inward','Lowering too far and rounding the lower back off the pad'],ez:'Lighter weight, partial range','hr':'Add weight or single-leg press'},
  db_lunge:{n:'Weighted Walking Lunge',c:'legs',d:2,weighted:true,e:'Dumbbells',m:'Quads · Glutes · Balance',desc:'Adds load to a movement pattern your bodyweight lunges have likely mastered already — genuine next step in difficulty.',steps:['Dumbbells at sides, step forward into a lunge','Back knee toward floor, front knee over ankle','Push through front foot to step into next lunge'],mistakes:['Front knee collapsing inward','Torso leaning too far forward'],ez:'Bodyweight walking lunges',hr:'Add weight or increase step distance'},
  leg_curl:{n:'Seated Leg Curl',c:'legs',d:1,weighted:true,e:'Leg Curl Machine',m:'Hamstrings',desc:'Direct hamstring isolation — a muscle group bodyweight training under-trains relative to quads.',steps:['Sit, pad against back of lower legs, knees aligned with machine pivot','Curl legs down/back through full range','Control the return to full stretch'],mistakes:['Using momentum to jerk the weight','Not achieving full range'],ez:'Lighter weight',hr:'Add weight or slow eccentric'},
  calf_raise_machine:{n:'Standing Calf Raise (Machine)',c:'legs',d:1,weighted:true,e:'Calf Raise Machine',m:'Calves',desc:'Loaded calf work past what bodyweight raises can overload once those get easy.',steps:['Balls of feet on platform, full stretch at bottom','Rise onto toes to full contraction','Lower with control past parallel for full stretch'],mistakes:['Bouncing instead of controlling the tempo','Only using a partial range'],ez:'Bodyweight calf raises',hr:'Add weight or single-leg'},

  /* ── SHOULDERS & REAR DELTS ── */
  close_grip_bench:{n:'Close-Grip Bench Press',c:'push',d:2,weighted:true,e:'Barbell + Bench',m:'Triceps · Chest · Front Delts',desc:'Bench press with a narrower grip so the triceps do most of the work. The best straight swap for dips when there is no dip station — same job, uses a bench you already have.',steps:['Lie on the bench, grip roughly shoulder-width, not narrower','Unrack and lower the bar to your lower chest','Keep the elbows tucked in close to your sides, not flared','Press back to full lockout'],mistakes:['Gripping far too narrow, which hurts the wrists','Flaring the elbows out and losing the tricep emphasis'],ez:'Lighter weight or machine chest press',hr:'Add weight or pause on the chest'},
  lateral_raise:{n:'Dumbbell Lateral Raise',c:'push',d:1,weighted:true,e:'Dumbbells',m:'Side Delts',desc:'The single most important exercise for shoulder width. Side delts get almost no work from pressing, so they need direct isolation — this is what builds the V-taper.',steps:['Light dumbbells at your sides, slight forward lean','Raise out to the sides to shoulder height, elbows soft','Lead with the elbows, not the hands','Lower slowly — the negative is where the growth is'],mistakes:['Going far too heavy and swinging the weight up','Shrugging the traps to assist','Raising above shoulder height'],ez:'Lighter dumbbells or seated',hr:'Cable lateral raise for constant tension'},
  cable_lateral_raise:{n:'Cable Lateral Raise',c:'push',d:1,weighted:true,e:'Cable Machine',m:'Side Delts',desc:'Cable version keeps tension on the side delt through the whole range, including the bottom where dumbbells go slack. Better stimulus per rep.',steps:['Set pulley to the lowest position, stand side-on','Grab the handle with the far hand, across your body','Raise out to shoulder height, elbow soft','Control all the way back down'],mistakes:['Standing too close to the stack','Using body momentum to swing it up'],ez:'Dumbbell lateral raise',hr:'Add weight or slow the eccentric'},
  face_pull:{n:'Cable Face Pull',c:'pull',d:1,weighted:true,e:'Cable Machine + Rope',m:'Rear Delts · Rotator Cuff · Upper Back',desc:'The best insurance policy for your shoulders once you start pressing heavy. Builds rear delts and pulls the shoulders back against all the pressing and desk time.',steps:['Rope attachment set at upper chest height','Pull the rope toward your face, hands splitting apart','Elbows high, squeeze the shoulder blades together','Control the return, keep tension throughout'],mistakes:['Pulling too low, turning it into a row','Going too heavy and losing the external rotation'],ez:'Band pull-apart',hr:'Add weight or pause at the contraction'},
  rear_delt_fly:{n:'Reverse Pec Deck',c:'pull',d:1,weighted:true,e:'Pec Deck Machine',m:'Rear Delts · Upper Back',desc:'Machine rear delt isolation. Rear delts are the most under-trained head of the shoulder and the one that completes a 3D look from the side.',steps:['Sit facing the pad, chest against it, grab the handles','Pull the arms back and out in an arc, elbows soft','Squeeze the shoulder blades at the end','Return under control to a full stretch'],mistakes:['Bending the elbows and turning it into a row','Using far too much weight and jerking'],ez:'Lighter weight, focus on the squeeze',hr:'Add weight or pause at the back'},
  shoulder_press_machine:{n:'Shoulder Press Machine',c:'push',d:1,weighted:true,e:'Shoulder Press Machine',m:'Shoulders · Triceps',desc:'Fixed path means you can push closer to failure safely without a spotter — ideal as a second pressing movement after free-weight work.',steps:['Adjust seat so handles sit at shoulder height','Press straight overhead to near lockout','Lower under control to a stretch at the bottom'],mistakes:['Seat set too low or too high','Bouncing out of the bottom'],ez:'Lighter weight',hr:'Single-arm or slow eccentric'},
  shrug:{n:'Dumbbell Shrug',c:'pull',d:1,weighted:true,e:'Dumbbells',m:'Upper Traps',desc:'Direct trap work. Traps fill out the neck-to-shoulder line and respond well to heavy loading.',steps:['Heavy dumbbells at your sides, arms straight','Shrug the shoulders straight up toward your ears','Pause at the top for a beat','Lower under control to a full stretch'],mistakes:['Rolling the shoulders — go straight up and down','Bending the elbows to help'],ez:'Lighter weight',hr:'Add weight or pause longer at the top'},

  /* ── CHEST ── */
  pec_deck:{n:'Pec Deck / Machine Fly',c:'push',d:1,weighted:true,e:'Pec Deck Machine',m:'Chest',desc:'Pure chest isolation with no triceps involvement. Great finisher after pressing since it hits the stretch position hard.',steps:['Seat set so handles are at chest height','Arms slightly bent, fixed throughout','Bring the handles together in front of your chest','Squeeze, then return slowly to a full stretch'],mistakes:['Bending the elbows to press instead of fly','Cutting the stretch short at the back'],ez:'Lighter weight',hr:'Add weight or pause at full contraction'},
  cable_fly:{n:'Cable Chest Fly',c:'push',d:1,weighted:true,e:'Cable Crossover',m:'Chest · Front Delts',desc:'Constant tension chest isolation. Adjust pulley height to bias upper, mid or lower chest.',steps:['Set both pulleys at chest height, stand between them','Step forward with a slight lean, arms out wide','Bring hands together in front, elbows slightly bent','Squeeze, then let the arms open slowly to a stretch'],mistakes:['Turning it into a press by bending the elbows','Standing too upright so tension drops off'],ez:'Pec deck',hr:'Add weight or single-arm'},
  chest_press_machine:{n:'Chest Press Machine',c:'push',d:1,weighted:true,e:'Chest Press Machine',m:'Chest · Triceps · Front Delts',desc:'Fixed-path pressing you can safely take to failure without a spotter. Ideal as your second press after the barbell work.',steps:['Seat set so handles line up with mid-chest','Press out to near lockout','Return slowly to a stretch, elbows just past the torso'],mistakes:['Seat too high, turning it into an incline press','Locking out hard and losing tension'],ez:'Lighter weight',hr:'Slow eccentric or single-arm'},

  /* ── BACK ── */
  seated_cable_row:{n:'Seated Cable Row',c:'pull',d:1,weighted:true,e:'Cable Row Machine',m:'Lats · Rhomboids · Biceps',desc:'Machine-based horizontal pull with no lower-back fatigue, so you can chase back thickness without the systemic cost of barbell rows.',steps:['Feet planted, slight knee bend, chest tall','Pull the handle to your lower ribs, elbows driving back','Squeeze the shoulder blades together','Return to a full stretch, letting the shoulders reach forward'],mistakes:['Rocking the torso back and forth for momentum','Rounding the lower back on the stretch'],ez:'Lighter weight',hr:'Single-arm or pause at the contraction'},
  t_bar_row:{n:'T-Bar Row',c:'pull',d:2,weighted:true,e:'T-Bar / Landmine',m:'Lats · Mid-Back · Rhomboids',desc:'Heavy horizontal pulling with a neutral grip and chest support on most setups. One of the best pure back-thickness builders.',steps:['Straddle the bar, chest up, hinge at the hips','Pull the handle to your lower chest','Squeeze the shoulder blades hard at the top','Lower to a full stretch under control'],mistakes:['Standing too upright','Jerking the weight with the lower back'],ez:'Seated cable row',hr:'Add weight or pause at the top'},
  straight_arm_pulldown:{n:'Straight-Arm Pulldown',c:'pull',d:1,weighted:true,e:'Cable Machine',m:'Lats · Core',desc:'Isolates the lats without the biceps taking over — and the straight-arm position is close to a front lever pull, so it carries over directly to your skill work.',steps:['Bar attachment at head height, arms straight out in front','Slight forward lean, brace the core','Pull the bar down to your thighs, arms locked straight','Control back up to a full lat stretch'],mistakes:['Bending the elbows and turning it into a pushdown','Using the lower back to swing the weight'],ez:'Lighter weight',hr:'Add weight or pause at the bottom'},
  assisted_pullup:{n:'Assisted Pull-Up Machine',c:'pull',d:0,weighted:true,e:'Assisted Pull-Up Machine',m:'Lats · Biceps',desc:'Lets you add pull-up volume after your heavy sets when bodyweight reps have run out. Useful for chasing total sets without failing early.',steps:['Set the assistance weight (higher number = more help)','Kneel or stand on the pad, full hang start','Pull until the chin clears the bar','Lower under control to a full stretch'],mistakes:['Using so much assistance it stops being challenging','Not going to full extension at the bottom'],ez:'More assistance weight',hr:'Less assistance, then bodyweight pull-ups'},

  hammer_curl_db:{n:'Dumbbell Hammer Curl',c:'pull',d:1,weighted:true,e:'Dumbbells',m:'Brachialis · Biceps · Forearms',desc:'Neutral grip hits the brachialis, which sits under the bicep and pushes it up — this is what actually makes arms look thicker from the side.',steps:['Dumbbells at your sides, palms facing each other','Curl up keeping the thumbs pointing up throughout','Squeeze at the top','Lower under control to full extension'],mistakes:['Rotating to a palms-up grip','Swinging the torso to start the rep'],ez:'Lighter dumbbells',hr:'Add weight or slow eccentric'},
  preacher_curl:{n:'Preacher Curl',c:'pull',d:1,weighted:true,e:'Preacher Bench / Machine',m:'Biceps',desc:'The pad eliminates all cheating, so the biceps take the full load. Hits the stretched position of the bicep hard.',steps:['Upper arms flat on the pad, chest against it','Curl the bar or handles up to your shoulders','Squeeze at the top','Lower slowly to near-full extension'],mistakes:['Lifting the elbows off the pad','Bouncing out of the bottom stretch position'],ez:'Lighter weight',hr:'Add weight or single-arm'},
  overhead_tricep_ext:{n:'Overhead Cable Tricep Extension',c:'push',d:1,weighted:true,e:'Cable Machine + Rope',m:'Triceps (Long Head)',desc:'The overhead position stretches the long head of the triceps, which pushdowns barely touch. The long head is most of your arm mass from behind.',steps:['Rope on a low pulley, face away, rope behind your head','Elbows pointing forward and kept still','Extend the arms fully overhead','Lower slowly to a deep stretch behind the head'],mistakes:['Elbows flaring wide','Letting the elbows drift and using the shoulders'],ez:'Lighter weight',hr:'Add weight or single-arm'},
  skullcrusher:{n:'EZ Bar Skullcrusher',c:'push',d:2,weighted:true,e:'EZ Bar + Bench',m:'Triceps',desc:'Heavy tricep isolation that loads the stretch. Pairs well with pushdowns, which load the contraction instead.',steps:['Lie on a bench, EZ bar held over your chest, arms straight','Bend at the elbows, lowering the bar toward your forehead','Keep the upper arms still and vertical','Extend back to lockout'],mistakes:['Letting the elbows drift back so it becomes a pullover','Flaring the elbows wide'],ez:'Lighter weight or dumbbell version',hr:'Add weight or slow eccentric'},

  /* ── LEGS ── */
  rdl:{n:'Romanian Deadlift',c:'legs',d:2,weighted:true,e:'Barbell',m:'Hamstrings · Glutes · Lower Back',desc:'The best hamstring and glute builder there is. Loads the stretch under tension, which is exactly what drives growth — and far less taxing than conventional deadlifts on a squat day.',steps:['Bar at hip height, shoulder-width grip, slight knee bend','Push the hips back, letting the bar slide down your thighs','Lower until you feel a deep hamstring stretch, back flat','Drive the hips forward to stand tall'],mistakes:['Rounding the lower back','Turning it into a squat by bending the knees too much','Going too low and losing the flat back'],ez:'Dumbbell RDL',hr:'Add weight or pause at the stretch'},
  leg_extension:{n:'Leg Extension',c:'legs',d:1,weighted:true,e:'Leg Extension Machine',m:'Quads',desc:'Pure quad isolation. Squats build the quads but this hits the rectus femoris in a way squats cannot, and lets you add volume without spinal load.',steps:['Seat back set so knees line up with the machine pivot','Extend the legs to full lockout','Squeeze the quads hard at the top','Lower slowly under control'],mistakes:['Swinging the weight up with momentum','Cutting the range short at the top'],ez:'Lighter weight',hr:'Add weight, pause at the top, or single-leg'},
  lying_leg_curl:{n:'Lying Leg Curl',c:'legs',d:1,weighted:true,e:'Lying Leg Curl Machine',m:'Hamstrings',desc:'Hits the hamstrings in the contracted position, complementing the RDL which loads the stretch. Together they cover the full hamstring.',steps:['Lie face down, pad against the back of your lower legs','Curl the heels toward your glutes','Squeeze hard at the top','Lower slowly to a full stretch'],mistakes:['Lifting the hips off the pad to cheat','Using momentum instead of control'],ez:'Lighter weight',hr:'Add weight or single-leg'},
  leg_press_machine:{n:'Leg Press',c:'legs',d:1,weighted:true,e:'Leg Press Machine',m:'Quads · Glutes',desc:'Lets you load the legs heavily without spinal compression or balance demands — ideal for adding quad volume after squats when you are already fatigued.',steps:['Feet shoulder-width on the platform, back flat against the pad','Lower until the knees reach about 90 degrees','Press back up without locking the knees out hard','Keep the lower back pinned to the pad throughout'],mistakes:['Letting the knees cave inward','Going so deep the lower back rounds off the pad','Locking the knees out aggressively'],ez:'Lighter weight, partial range',hr:'Add weight or single-leg press'},

  hip_thrust:{n:'Barbell Hip Thrust',c:'legs',d:2,weighted:true,e:'Barbell + Bench',m:'Glutes · Hamstrings',desc:'The most direct glute builder available. Glutes are the biggest muscle in your body and squats alone under-train them at the top range.',steps:['Upper back against a bench, bar across the hips with a pad','Feet flat, shins vertical at the top','Drive the hips up until the body is level','Squeeze the glutes hard at the top, lower under control'],mistakes:['Arching the lower back instead of squeezing the glutes','Pushing through the toes instead of the heels'],ez:'Bodyweight glute bridge',hr:'Add weight or pause at the top'},
  seated_calf_raise:{n:'Seated Calf Raise',c:'legs',d:1,weighted:true,e:'Seated Calf Machine',m:'Calves (Soleus)',desc:'The bent-knee position targets the soleus, which the standing version misses. Training both is what actually builds calf size.',steps:['Pad across the thighs, balls of feet on the platform','Lower the heels for a full stretch','Rise up onto the toes as high as possible','Pause at the top, lower slowly'],mistakes:['Bouncing through partial reps','Skipping the stretch at the bottom'],ez:'Lighter weight',hr:'Add weight or pause longer at the top'},

const hex=(col,a)=>`${col}${Math.round(a*255).toString(16).padStart(2,'0')}`;
function colOf(c){return C[c]||'#A39D93';}
function dots(n,max=4,col){let h='';for(let i=0;i<max;i++)h+=`<span${i<n+1?` class="on" style="background:${col}"`:''} ></span>`;return`<span class="dots">${h}</span>`;}
function pill(label,val,cur,onclick,extra=''){
  let ac=C[val]||'#5E86A8';
  const m=/--ac:\s*([^;"']+)/.exec(extra||'');
  if(m)ac=m[1].trim();
  return`<button class="pill sm${cur===val?' active':''}" style="--ac:${ac}" onclick="${onclick}">${label}</button>`;
}

// Returns the last recorded sets for an exercise from history
function getLastEx(exId){
  for(let i=ST.hist.length-1;i>=0;i--){
    const h=ST.hist[i];
    if(h.log&&h.log[exId]&&h.log[exId].length>0){
      return{date:h.date,sets:h.log[exId],workout:h.wk};
    }
  }
  return null;
}

  const badge=ex.custom?'<span style="font-size:9px;background:rgba(242,240,235,.07);border-radius:4px;padding:1px 5px;color:var(--dim);margin-left:4px">MY</span>':'';

  const weightedTag=ex.weighted?`<span style="display:inline-flex;align-items:center;gap:3px;font-size:9px;color:var(--dim);letter-spacing:0.5px;margin-right:8px;flex-shrink:0;font-weight:700"><svg width="10" height="10" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h12M6 7v8M14 7v8M3 8v6M17 8v6"/></svg>Weighted</span>`:'';
  return`<div class="ex-row" onclick="${oc}">
    <div class="cat-badge" style="background:${hex(col,0.12)};border:1px solid ${hex(col,0.3)};color:${col}">${EMOJ[ex.c]||''}</div>
    <div style="flex:1"><h3>${ex.n}${badge}</h3><p>${ex.m}</p></div>
    ${weightedTag}${timedTag}${dots(ex.d,4,col)}${del}
  </div>`;
}

function progMuscles(p,limit){
  const tally={};
  const opt=p.custom?{ex:(p.exs||[])}:(p.s||p.q||p.f);
  if(!opt||!opt.ex)return[];
  opt.ex.forEach(e=>{
    const ex=getEx(e.id); if(!ex||!ex.m)return;
    ex.m.split('·').forEach((m,idx)=>{
      m=m.trim().replace(/\s*\(.*\)/,'');
      if(!m)return;
      // first-listed muscle is the primary mover, so weight it higher
      tally[m]=(tally[m]||0)+(e.s||1)*(idx===0?2:1);
    });
  });
  return Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,limit||4).map(x=>x[0]);
}

function deleteFromBuilder(){
  // Custom workout you built — remove it outright
  if(ST.bldId){
    if(!confirm('Delete this workout permanently? This cannot be undone.'))return;
    ST.customs=ST.customs.filter(x=>x.id!==ST.bldId);
    sv('customs',ST.customs);
    ST.bldOpen=false;ST.bldId=null;ST.bldPreloadId=null;
    render();return;
  }
  // Built-in program — can't be removed, but your edited version can be
  const id=ST.bldPreloadId;
  if(!id)return;
  if(ST.editedProgs&&ST.editedProgs[id]){
    if(!confirm('This is a built-in program, so it cannot be deleted — but your edited version can be removed, restoring the original. Continue?'))return;
    delete ST.editedProgs[id];
    sv('editedProgs',ST.editedProgs);
    ST.bldOpen=false;ST.bldPreloadId=null;
    render();return;
  }
  alert('Built-in programs cannot be deleted. Use the mode toggle or your schedule to choose different workouts.');
}

function exportWorkoutText(log,wkName,date,dur,notes){
  const lines=[`${wkName} | ${date}${dur?' | '+dur+' min':''}`,''];
  Object.entries(log||{}).forEach(([id,sets])=>{
    const ex=getEx(id);
    lines.push(ex?ex.n:id);
    sets.forEach((s,i)=>{
      let val;
      if(s.weight)val=`${s.weight}kg × ${s.reps} reps`;
      else if(ex&&ex.timed)val=`${s.reps}s`;
      else val=`${s.reps} reps`;
      lines.push(`  Set ${i+1}: ${val}${s.rpe?'  ('+['','Easy','Moderate','Hard','Max'][s.rpe]+')':''}`);
    });
    lines.push('');
  });
  if(notes)lines.push('Notes: '+notes,'');
  return lines.join('\n');
}
function copyExport(text){

}

      <div><div style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:18px;color:${col}">${exs.length}</div><div style="font-size:9px;color:var(--dim);letter-spacing:1px">Exercises</div></div>
    </div>`:''}
    <div class="card" style="margin-bottom:12px;border-color:${hex('#5E86A8',0.3)};background:${hex('#5E86A8',0.06)}">
      <div class="slabel" style="color:#5E86A8;margin-bottom:8px">Warm up first · 3–5 MIN</div>

    </div>
    <div class="slabel">Exercises</div>${exList}
    <button class="btn" style="margin-top:8px;background:${col}" onclick="trBegin()">Start workout</button>
  </div>`;
}

function trActive(){
  const p=ST.trProg;if(!p)return trSelect();
  const isCustom=!!p.custom;
  const col=isCustom?'#5E86A8':colOf(p.c);
  const restSec=isCustom?p.rest||90:getOpt(p,ST.trTime)?getOpt(p,ST.trTime).rest:90;
  const exs=isCustom?p.exs||[]:getOpt(p,ST.trTime)?getOpt(p,ST.trTime).ex:[];
  const curE=exs[ST.trExIdx];
  if(!curE){trFinish();return'';}
  const ex=getEx(curE.id);
  if(!ex){trFinish();return'';}
  const totalSets=curE.s||3;
  const pct=exs.length>0?Math.min(((ST.trExIdx*totalSets+ST.trSetIdx)/(exs.length*totalSets))*100,100):0;

  const curLog=ST.trLog[curE.id]||[];

  // Progression suggestion — show if they've been hitting top of rep range
  const repRangeParts=curE.r?curE.r.split('-'):[];
  const topReps=repRangeParts.length>1?parseInt(repRangeParts[1]):null;
  const hitTop=topReps&&curLog.length>0&&curLog[curLog.length-1].reps>=topReps;
  const setHistory=curLog.length?`<div class="card" style="margin-bottom:9px">
    <div class="slabel">Completed sets</div>

      <div class="rv" style="color:${col}">${fmtSetVal(s,ex)}</div>
      <div class="rl">SET ${i+1}</div>
      <div style="font-size:8px;color:${RPEC[s.rpe||2]}">${RPEL[s.rpe||2]}</div>

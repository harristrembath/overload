  const restBox=ST.restSecs?`<div class="rest-box" style="background:${hex(col,0.1)};border:1px solid ${hex(col,0.25)}">
    <div>
      <div style="font-size:9px;color:${col};letter-spacing:3px;font-family:'Instrument Sans',sans-serif;font-weight:700;margin-bottom:2px">REST</div>
      <div class="rest-time" id="rest-display" style="color:${col}">${ST.restSecs}s</div>
    </div>
    <button class="btn" style="background:${col};width:auto;padding:9px 14px;font-size:13px" onclick="skipRest()">SKIP ›</button>
  </div>`:'';
  return`<div style="height:3px;background:var(--border)"><div style="height:3px;background:${col};width:${pct}%;transition:width .3s"></div></div>
  <div class="page" style="padding-top:11px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div>
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:2px">
          <div style="font-size:10px;color:var(--dim)">${p.n}</div>
          <span style="font-size:9px;font-weight:600;letter-spacing:.6px;padding:2px 7px;border-radius:20px;background:var(--accent-dim);border:1px solid var(--accent-border);color:var(--accent);flex-shrink:0">${({cali:'Cali',weights:'Weights',hybrid:'Hybrid'})[ST.trainMode]||'Cali'}</span>
        </div>
        <div style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:13px">${ST.trExIdx+1} / ${exs.length} exercises</div>
      </div>
      <div style="text-align:right">
        <div style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:20px;color:${col}" id="workout-clock">${elapsed}m</div>
        <button onclick="trEndEarly()" style="background:transparent;border:none;color:var(--dim);font-size:10px;cursor:pointer">End early</button>
      </div>
    </div>
    ${restBox}
    <div class="card" style="margin-bottom:9px">
      <div style="font-size:9px;color:${col};letter-spacing:2px;font-family:'Instrument Sans',sans-serif;font-weight:700;margin-bottom:2px">${ex.c.toUpperCase()}</div>
      <div style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:24px;line-height:1">${ex.n}</div>
      <div style="font-size:11px;color:var(--dim);margin-top:3px">Set ${ST.trSetIdx+1} of ${totalSets} · Target: ${curE.r}</div>
      ${pr?`<div style="font-size:10px;color:var(--core);margin-top:2px">PR: ${fmtPR(pr,ex)} (${pr.date})</div>`:''}
      ${hitTop&&ex.hr?`<div style="font-size:10px;color:var(--push);margin-top:4px;font-weight:700">↑ Hitting target — next progression: ${ex.hr}</div>`:''}
      ${(()=>{
        const last=getLastEx(curE.id);
        if(!last)return`<div style="font-size:10px;color:var(--dim);margin-top:4px;font-style:italic">First time doing this exercise</div>`;
        const maxR=ex.weighted?Math.max(...last.sets.map(s=>s.weight||0)):Math.max(...last.sets.map(s=>s.reps));
        const setStr=last.sets.map((s,i)=>`<span style="background:var(--card2);border-radius:5px;padding:2px 6px;font-weight:700;color:var(--text)">${fmtSetVal(s,ex)}</span>`).join(' ');
        return`<div style="margin-top:8px;background:${hex(col,0.08)};border:1px solid ${hex(col,0.2)};border-radius:8px;padding:8px 10px">
          <div style="font-size:9px;letter-spacing:2px;color:${col};font-family:'Instrument Sans',sans-serif;font-weight:700;margin-bottom:5px">LAST TIME · ${last.date}</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--dim)">
            ${setStr}
            <span style="color:${col};font-weight:700;margin-left:2px">Best: ${ex.weighted?maxR+'kg':maxR+' reps'}</span>
          </div>
        </div>`;
      })()}
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
        <button class="btn secondary" style="padding:6px 10px;font-size:11px;width:auto" onclick="showEx('${curE.id}')">Form guide ↗</button>
        <button class="btn secondary" style="padding:6px 10px;font-size:11px;width:auto" onclick="trOpenSwap()">Swap ⇄</button>
        <button class="btn secondary" style="padding:6px 10px;font-size:11px;width:auto" onclick="trMoveEx(1)">Later ↓</button>
        <button class="btn secondary" style="padding:6px 10px;font-size:11px;width:auto" onclick="trSkipEx()">Skip ›</button>
      </div>
    </div>
    ${setHistory}
    <div class="card" style="margin-bottom:9px">
      <div class="slabel">Log set ${ST.trSetIdx+1}</div>
      ${ex.timed?`<div style="text-align:center;margin-bottom:12px">
        <div id="hold-timer-display" style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:72px;line-height:1;color:${col}">${trHoldSecs||0}s</div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:12px">Target: ${curE.r}</div>
        <button onclick="trTimerToggle()" style="width:100%;padding:14px;border-radius:var(--r-md);border:none;background:${col};color:#fff;font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:16px;cursor:pointer">${trHoldTimer?'Stop timer':'Start timer'}</button>
        <div style="margin:10px 0 4px;font-size:11px;color:var(--muted)">— or enter manually below —</div>
      </div>`:''}
      ${ex.weighted?`<div class="slabel">Weight (kg)</div>
      <div style="display:flex;gap:7px;align-items:center;margin-bottom:11px">
        <button onclick="trWeightAdj(-2.5)" style="width:46px;height:46px;border-radius:9px;background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:24px;cursor:pointer;flex-shrink:0">−</button>
        <input id="weight-input" type="number" step="0.5" class="input" style="flex:1;height:46px;text-align:center;font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:26px;padding:0" value="${ST.trWeight}" oninput="ST.trWeight=this.value" placeholder="kg">
        <button onclick="trWeightAdj(2.5)" style="width:46px;height:46px;border-radius:9px;background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:24px;cursor:pointer;flex-shrink:0">+</button>
      </div>
      <div class="slabel">Reps</div>`:''}
      <div style="display:flex;gap:7px;align-items:center;margin-bottom:11px">
        <button onclick="trRepsAdj(-1)" style="width:46px;height:46px;border-radius:9px;background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:24px;cursor:pointer;flex-shrink:0">−</button>
        <input id="reps-input" type="number" class="input" style="flex:1;height:46px;text-align:center;font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:26px;padding:0" value="${ST.trReps}" oninput="ST.trReps=this.value" placeholder="${ex.timed?'Seconds':'Reps'}">
        <button onclick="trRepsAdj(1)" style="width:46px;height:46px;border-radius:9px;background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:24px;cursor:pointer;flex-shrink:0">+</button>
      </div>
      <div class="slabel">Effort</div>
      <div style="display:flex;gap:5px;margin-bottom:11px">${rpeRow}</div>
      <button class="btn" style="background:${col}" onclick="trLogSet()">Log set ${ST.trSetIdx+1} ${ex.weighted?'('+(ST.trWeight||0)+'kg × '+(ST.trReps||0)+')':ex.timed?'('+((ST.trReps||trHoldSecs||0))+'s)':''}</button>
      <button onclick="trSkipSet()" style="width:100%;padding:8px;margin-top:5px;background:transparent;border:none;color:var(--dim);font-size:11px;cursor:pointer">Skip this set</button>
    </div>
    <div class="card">
      <div class="slabel">Notes</div>
      <textarea class="input" rows="2" style="font-size:14px" placeholder="Optional notes..." oninput="ST.trNotes=this.value">${ST.trNotes}</textarea>
      <button onclick="copyExport(exportWorkoutText(ST.trLog,ST.trProg?ST.trProg.n:'Workout',dkey(),ST.trStart?Math.round((Date.now()-ST.trStart)/60000):0,ST.trNotes))" style="width:100%;margin-top:8px;padding:9px;border-radius:var(--r-sm);border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:12px;cursor:pointer">Share / Export Workout</button>
    </div>
  </div>`;
}

function trDone(){
  const p=ST.trProg;
  const col=p&&!p.custom?colOf(p.c):'#5E86A8';
  const totalS=Object.values(ST.trLog).reduce((a,s)=>a+s.length,0);
  const totalR=Object.values(ST.trLog).reduce((a,s)=>a+s.reduce((b,x)=>b+x.reps,0),0);
  const newPrs=Object.entries(ST.trLog).filter(([id,sets])=>{
    const exO=getEx(id);
    if(exO&&exO.weighted){const mw=Math.max(...sets.map(s=>s.weight||0));return ST.prs[id]&&mw>=(ST.prs[id].weight||0);}
    const mx=Math.max(...sets.map(s=>s.reps));return ST.prs[id]&&mx>=ST.prs[id].reps;
  }).map(([id])=>id);
  return`<div style="padding:30px 16px;display:flex;flex-direction:column;align-items:center;min-height:60vh">
    <div style="width:52px;height:52px;border-radius:15px;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;margin-bottom:16px">${TROPHYIC}</div>
    <div style="font-family:'Instrument Sans',sans-serif;font-size:34px;font-weight:700;margin-bottom:4px">Session logged</div>
    <div style="color:var(--dim);margin-bottom:18px;text-align:center">${p?p.n:'Workout'}</div>
    <div style="display:flex;gap:9px;margin-bottom:14px;width:100%;max-width:300px">
      ${[['SETS',totalS,col],['REPS',totalR,'#84A8C4'],['MIN',Math.round((Date.now()-(ST.trStart||Date.now()))/60000),'#5E86A8']].map(([l,v,c])=>`<div class="stat-box" style="flex:1"><div class="val" style="color:${c}">${v}</div><div class="lbl">${l}</div></div>`).join('')}
    </div>
    ${newPrs.length?`<div style="background:rgba(94,134,168,.09);border:1px solid rgba(94,134,168,.35);border-radius:9px;padding:11px;margin-bottom:14px;width:100%;max-width:300px">
      <div style="font-size:9px;color:var(--core);letter-spacing:2px;font-family:'Instrument Sans',sans-serif;font-weight:700;margin-bottom:5px">New personal records</div>
      ${newPrs.map(id=>`<div style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:14px">${getEx(id)?getEx(id).n:id}</div>`).join('')}
    </div>`:''}
    <button class="btn" style="background:${col};max-width:300px" onclick="trReset()">Back to today</button>
    <button onclick="editJustFinished()" style="width:100%;max-width:300px;margin-top:9px;padding:11px;border-radius:var(--r-sm);border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:13px;cursor:pointer">Edit this session</button>
  </div>`;
}

function pageStats(){
  if(ST.viewPBs)return pagePBTracker();
  const h=ST.hist;
  const total=h.length;
  const thisWeek=h.filter(x=>x.date>=weekOf()).length;
  const thisMonth=h.filter(x=>x.date>=dkey(new Date(new Date().getFullYear(),new Date().getMonth(),1))).length;
  const totalReps=h.reduce((a,x)=>a+Object.values(x.log||{}).reduce((b,s)=>b+s.reduce((c,r)=>c+r.reps,0),0),0);
  const totalSets=h.reduce((a,x)=>a+Object.values(x.log||{}).reduce((b,s)=>b+s.length,0),0);

  // Streak (current)
  const streak=(()=>{if(!h.length)return 0;const d=[...new Set(h.map(x=>x.date))].sort().reverse();let s=0,dt=new Date();for(const date of d){const diff=Math.round((dt-new Date(date))/86400000);if(diff<=1){s++;dt=new Date(date);}else break;}return s;})();

  // Longest streak ever
  const longestStreak=(()=>{
    if(!h.length)return 0;
    const dates=[...new Set(h.map(x=>x.date))].sort();
    let best=1,cur=1;
    for(let i=1;i<dates.length;i++){
      const diff=Math.round((new Date(dates[i])-new Date(dates[i-1]))/86400000);
      if(diff===1){cur++;if(cur>best)best=cur;}else cur=1;
    }
    return best;
  })();

  // Avg per week (over last 8 weeks)
  const avgPerWeek=(()=>{
    if(!h.length)return 0;
    const w={};h.forEach(x=>{const k=weekOf(new Date(x.date));w[k]=(w[k]||0)+1;});
    const vals=Object.values(w).slice(-8);
    return vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):'0';
  })();

  // Weekly chart data
  const weekData=(()=>{const w={};h.forEach(x=>{const k=weekOf(new Date(x.date));w[k]=(w[k]||0)+1;});return Object.entries(w).sort(([a],[b])=>a<b?-1:1).slice(-10);})();

  // Workout type breakdown
  const typeBreak=(()=>{const t={};h.forEach(x=>{t[x.wk]=(t[x.wk]||0)+1;});return Object.entries(t).sort(([,a],[,b])=>b-a).slice(0,8);})();

  // PRs
  const prList=Object.entries(ST.prs).sort(([,a],[,b])=>b.reps-a.reps).slice(0,10);

  // Top exercises by frequency
  const exFreq=(()=>{
    const f={};
    h.forEach(x=>Object.keys(x.log||{}).forEach(id=>{f[id]=(f[id]||0)+1;}));
    return Object.entries(f).sort(([,a],[,b])=>b-a).slice(0,6);
  })();

  // Recent sessions
  const recent=[...h].reverse().slice(0,8);

  // Monthly breakdown (last 6 months)
  const monthData=(()=>{
    const m={};
    h.forEach(x=>{const d=new Date(x.date);const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;m[k]=(m[k]||0)+1;});
    return Object.entries(m).sort(([a],[b])=>a<b?-1:1).slice(-6).map(([k,v])=>({month:k.slice(5),count:v}));
  })();

  const chartH=90;
  const maxW=weekData.length?Math.max(...weekData.map(([,v])=>v)):1;
  const barW=weekData.length?Math.floor(280/weekData.length-4):28;
  const bars=weekData.map(([week,count],i)=>{const bh=Math.round((count/maxW)*chartH*0.85);const x=i*(barW+4)+2;return`<rect x="${x}" y="${chartH-bh}" width="${barW}" height="${bh}" fill="#5E86A8" rx="3"/><text x="${x+barW/2}" y="${chartH+13}" text-anchor="middle" fill="var(--dim)" font-size="8" font-family="Instrument Sans,sans-serif">${week.slice(0,5)}</text>`;}).join('');
  const chart=weekData.length?`<div class="card" style="margin-bottom:11px"><div class="slabel">Sessions per week</div><svg class="svgbar bar-chart" width="100%" height="${chartH+18}" viewBox="0 0 ${Math.max(weekData.length*(barW+4),60)} ${chartH+18}">${bars}</svg></div>`:'';

  const mBars=monthData.map((m,i)=>{const bh=Math.round((m.count/Math.max(...monthData.map(x=>x.count),1))*70);const x=i*(38+4)+2;return`<rect x="${x}" y="${80-bh}" width="38" height="${bh}" fill="#84A8C4" rx="3"/><text x="${x+19}" y="95" text-anchor="middle" fill="var(--dim)" font-size="9" font-family="Instrument Sans,sans-serif">${m.month}</text><text x="${x+19}" y="${75-bh}" text-anchor="middle" fill="#84A8C4" font-size="9" font-weight="700" font-family="Instrument Sans,sans-serif">${m.count}</text>`;}).join('');
  const monthChart=monthData.length?`<div class="card" style="margin-bottom:11px"><div class="slabel">Sessions by month</div><svg class="svgbar" width="100%" height="100" viewBox="0 0 ${Math.max(monthData.length*42,60)} 100">${mBars}</svg></div>`:'';

  const breakdown=typeBreak.length?`<div class="card" style="margin-bottom:11px"><div class="slabel">Most trained</div>${typeBreak.map(([n,cnt])=>`<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:14px">${n}</span><span style="font-size:11px;color:var(--dim)">${cnt}× · ${Math.round(cnt/Math.max(total,1)*100)}%</span></div><div class="prog-bar-wrap"><div class="prog-bar" style="background:var(--push);width:${(cnt/Math.max(total,1))*100}%"></div></div></div>`).join('')}</div>`:'';

  const exFreqCard=exFreq.length?`<div class="card" style="margin-bottom:11px"><div class="slabel">Top exercises</div>${exFreq.map(([id,cnt])=>{const ex=EX[id];if(!ex)return'';const ec=colOf(ex.c);return`<div style="display:flex;align-items:center;gap:9px;margin-bottom:8px"><div style="width:30px;height:30px;border-radius:7px;background:${hex(ec,0.15)};border:1px solid ${hex(ec,0.3)};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:${ec};font-family:'Instrument Sans',sans-serif;flex-shrink:0">${EMOJ[ex.c]||''}</div><div style="flex:1"><div style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:14px">${ex.n}</div><div style="font-size:9px;color:var(--dim)">${ex.m}</div></div><div style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:16px;color:${ec}">${cnt}×</div></div>`;}).join('')}</div>`:'';

  const prs=prList.length?`<div class="card" style="margin-bottom:11px"><div class="slabel">Personal records</div>${prList.map(([id,pr])=>{const ex=getEx(id);return ex?`<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:7px;margin-bottom:7px"><div><div style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:15px">${ex.n}</div><div style="font-size:9px;color:var(--dim)">${pr.date}</div></div><div style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:20px;color:var(--core)">${pr.reps}${ex.timed?'s':' reps'}</div></div>`:'';}).join('')}</div>`:'';

  // Body weight chart
  const wtData=ST.weights.slice(-12);
  const wtChart=wtData.length>1?(()=>{
    const mn=Math.min(...wtData.map(w=>w.kg))-1;
    const mx2=Math.max(...wtData.map(w=>w.kg))+1;
    const w2=Math.max(wtData.length*36,100);
    const pts=wtData.map((w,i)=>`${i*(w2/(wtData.length-1))},${80-((w.kg-mn)/(mx2-mn))*70}`).join(' ');
    const dots2=wtData.map((w,i)=>`<circle cx="${i*(w2/(wtData.length-1))}" cy="${80-((w.kg-mn)/(mx2-mn))*70}" r="4" fill="#84A8C4"/><text x="${i*(w2/(wtData.length-1))}" y="${80-((w.kg-mn)/(mx2-mn))*70-8}" text-anchor="middle" fill="#84A8C4" font-size="9" font-family="Instrument Sans,sans-serif" font-weight="700">${w.kg}</text>`).join('');
    return`<polyline points="${pts}" fill="none" stroke="#84A8C4" stroke-width="2"/>${dots2}`;
  })():'';
  const wtChange=wtData.length>1?((wtData[wtData.length-1].kg-wtData[0].kg)).toFixed(1):null;
  const wtHistList=(()=>{
    if(!ST.weights.length)return'';
    const rev=[...ST.weights].map((w,i)=>({...w,idx:i})).reverse().slice(0,10);
    const rows=rev.map((w,i)=>{
      const last=i===rev.length-1;
      const bstyle=last?'':'border-bottom:1px solid var(--border);';
      if(ST.wtEditIdx===w.idx){
        return`<div style="display:flex;align-items:center;gap:7px;padding:7px 0;${bstyle}">
          <input id="wt-edit-input" type="number" step="0.1" class="input" style="flex:1;font-size:15px;padding:8px 10px" value="${w.kg}" autocomplete="off">
          <button onclick="saveWeightEdit(${w.idx})" style="background:#5E86A8;border:none;color:#000;border-radius:var(--r-sm);padding:8px 11px;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0">Save</button>
          <button onclick="ST.wtEditIdx=null;render()" style="background:transparent;border:1px solid var(--border);color:var(--dim);border-radius:var(--r-sm);padding:8px 11px;font-size:11px;cursor:pointer;flex-shrink:0">Cancel</button>
        </div>`;
      }
      return`<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;${bstyle}">
        <div>
          <span style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:15px">${w.kg}kg</span>
          <span style="font-size:10px;color:var(--dim);margin-left:8px">${w.date}</span>
        </div>
        <div style="display:flex;gap:2px">
          <button onclick="ST.wtEditIdx=${w.idx};render()" style="background:transparent;border:none;color:var(--muted);cursor:pointer;padding:6px 8px;display:flex;align-items:center"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 3.5l3 3L6 17H3v-3L13.5 3.5z"/><path d="M11.5 5.5l3 3"/></svg></button>
          <button onclick="deleteWeightEntry(${w.idx})" style="background:transparent;border:none;color:#B0524F;cursor:pointer;padding:6px 8px;display:flex;align-items:center"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12"/><path d="M8 6V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2"/><path d="M5 6l1 11a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-11"/><line x1="8.5" y1="9" x2="8.5" y2="14"/><line x1="11.5" y1="9" x2="11.5" y2="14"/></svg></button>
        </div>
      </div>`;
    }).join('');
    return`<div style="margin-top:12px;border-top:1px solid var(--border);padding-top:10px">
      <div class="slabel" style="margin-bottom:2px">Log history</div>
      ${rows}
    </div>`;
  })();
  const weightCard=`<div class="card" style="margin-bottom:11px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div class="slabel" style="margin:0">Body weight</div>
      ${wtChange!==null?`<span style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:16px;color:${parseFloat(wtChange)>0?'#5E86A8':parseFloat(wtChange)<0?'#B0524F':'var(--dim)'}">${parseFloat(wtChange)>0?'+':''}${wtChange}kg</span>`:''}
    </div>
    ${wtData.length>1?`<svg width="100%" height="100" viewBox="0 0 ${Math.max(wtData.length*36,100)} 100" style="margin-bottom:8px">${wtChart}</svg>`:''}
    <div style="display:flex;gap:8px;align-items:center">
      <input id="wt-input" type="number" step="0.1" class="input" style="flex:1;font-size:16px" placeholder="${ST.weights.length?'e.g. '+ST.weights[ST.weights.length-1].kg:'e.g. 60.5'} kg" min="30" max="200">
      <button onclick="logWeight()" class="btn" style="flex:0 0 auto;width:auto;padding:11px 16px;background:var(--pull)">Log</button>
    </div>
    ${wtData.length?`<div style="font-size:10px;color:var(--dim);margin-top:6px">Last: ${wtData[wtData.length-1].kg}kg on ${wtData[wtData.length-1].date}</div>`:'<div style="font-size:11px;color:var(--dim);margin-top:6px">Log your weight weekly to track progress. Aim for +0.3–0.5kg/week.</div>'}
    ${wtHistList}
  </div>`;

  // Session detail view
  if(ST.viewSession!==null){
    const sess=h[ST.viewSession];
    if(sess){
      const isEditing=ST.editingSession;
      const sessLog=Object.entries(sess.log||{}).map(([id,sets])=>{const ex=getEx(id);return`<div style="margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <div style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:16px">${ex?ex.n:id}</div>
          ${isEditing?`<button onclick="openSessionSwap('${id}')" style="background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:3px 8px;font-size:10.5px;cursor:pointer;flex-shrink:0">Swap ⇄</button>`:''}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${sets.map((s,si)=>{
          const exO=getEx(id);
          const isW=s.weight!==undefined&&s.weight!==null;
          const RL=['','Easy','Moderate','Hard','Max'];
          if(isEditing){
            return`<div style="background:var(--card2);border-radius:7px;padding:7px 8px;text-align:center;min-width:${isW?'92':'58'}px">
              ${isW?`<div style="display:flex;align-items:baseline;justify-content:center;gap:2px">
                <input type="number" step="0.5" value="${s.weight}" style="width:42px;background:transparent;border:none;border-bottom:1px solid var(--accent);color:var(--accent);font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:16px;text-align:center;outline:none" oninput="editSessionSet('${id}',${si},parseFloat(this.value)||0,'weight')">
                <span style="font-size:10px;color:var(--dim)">kg</span>
              </div>`:''}
              <input type="number" value="${s.reps}" style="width:40px;background:transparent;border:none;border-bottom:1px solid var(--accent);color:var(--push);font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:${isW?'15':'18'}px;text-align:center;outline:none;margin-top:${isW?'3':'0'}px" oninput="editSessionSet('${id}',${si},parseFloat(this.value)||0,'reps')">
              <select style="width:100%;background:transparent;border:none;color:var(--dim);font-size:9px;text-align:center;outline:none;margin-top:3px;cursor:pointer" onchange="editSessionSet('${id}',${si},parseInt(this.value),'rpe')">
                ${[1,2,3,4].map(r=>`<option value="${r}" ${(s.rpe||2)===r?'selected':''}>${RL[r]}</option>`).join('')}
              </select>
              <div style="font-size:9px;color:var(--dim)">SET ${si+1}</div>
            </div>`;
          }
          return`<div style="background:var(--card2);border-radius:7px;padding:6px 10px;text-align:center">
            <div style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:${isW?'15':'18'}px;color:var(--push)">${isW?s.weight+'kg × '+s.reps:s.reps+(exO&&exO.timed?'s':'')}</div>
            <div style="font-size:9px;color:var(--dim)">SET ${si+1}${s.rpe?' · '+RL[s.rpe]:''}</div>
          </div>`;
        }).join('')}</div>
      </div>`;}).join('');
      const totS=Object.values(sess.log||{}).reduce((a,s)=>a+s.length,0);
      const totR=Object.values(sess.log||{}).reduce((a,s)=>a+s.reduce((b,x)=>b+x.reps,0),0);
      return`<div class="ph" style="padding:22px 14px 14px">
        <button onclick="closeSession()" style="background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer;margin-bottom:8px">←</button>
        <div style="display:flex;align-items:flex-start;justify-content:space-between">
          <div><div class="eyebrow" style="color:var(--full)">${sess.date}</div><h1 style="font-size:26px">${sess.wk||'Workout'}</h1></div>
          <div style="display:flex;gap:7px;margin-top:4px">
            <button onclick="${isEditing?'saveSessionEdit()':'ST.editingSession=true;render()'}" style="background:${isEditing?'#5E86A8':'var(--card2)'};border:1px solid ${isEditing?'#5E86A8':'var(--border)'};color:${isEditing?'#000':'var(--muted)'};border-radius:var(--r-sm);padding:7px 13px;font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:12px;cursor:pointer">${isEditing?'Save':'Edit'}</button>
            <button onclick="shareSession(${ST.viewSession})" style="background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:var(--r-sm);padding:7px 13px;font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:12px;cursor:pointer">Share</button>
          </div>
        </div>
        <div style="display:flex;gap:9px;margin-top:8px">
          ${[['SETS',totS,'var(--push)'],['REPS',totR,'var(--pull)'],['MIN',sess.dur||'—','var(--full)']].map(([l,v,c])=>`<div class="stat-box" style="flex:1"><div class="val" style="color:${c};font-size:22px">${v}</div><div class="lbl">${l}</div></div>`).join('')}
        </div>
      </div>
      <div class="page">${sessLog}${sess.notes?`<div class="card"><div class="slabel">Notes</div><p style="font-size:13px;color:#C9C4B9;line-height:1.6">${sess.notes}</p></div>`:''}</div>`;
    }
  }

  const recentList=recent.length?`<div class="card" style="margin-bottom:11px"><div class="slabel">Recent sessions — tap to review</div>${recent.map((x,i)=>{const tS=Object.values(x.log||{}).reduce((a,s)=>a+s.length,0);const tR=Object.values(x.log||{}).reduce((a,s)=>a+s.reduce((b,r)=>b+r.reps,0),0);const exCount=Object.keys(x.log||{}).length;const idx=h.length-1-i;const durStr=x.dur?' · '+x.dur+' min':'';return`<div onclick="viewSession(${idx})" style="display:flex;align-items:center;gap:9px;cursor:pointer;${i<recent.length-1?'border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:8px':''}"><div style="width:34px;height:34px;border-radius:7px;background:${hex('#5E86A8',0.15)};display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h2m10 0h2M6 6v8m8-8v8M6 10h8"/></svg></div><div style="flex:1"><div style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:14px">${x.wk||'Workout'}</div><div style="font-size:9px;color:var(--dim)">${x.date}${durStr} · ${exCount} exercises</div></div><div style="text-align:right"><div style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:13px;color:var(--push)">${tS} sets</div><div style="font-size:9px;color:var(--dim)">${tR} reps</div></div><span style="color:var(--dim);font-size:14px;margin-left:4px">›</span></div>`;}).join('')}</div>`:'';
  const empty=!total?`<div style="text-align:center;padding:40px"><p style="color:var(--dim);font-size:13px">Complete your first workout to see stats here.</p></div>`:'';
  const dataCard=`<div class="card" style="margin-top:11px"><div class="slabel">Data</div><p style="font-size:12px;color:var(--dim);margin-bottom:12px;line-height:1.6">Export all your data as a backup file. Import to restore on any device.</p><div style="display:flex;gap:8px"><button class="btn" style="flex:1;background:var(--pull)" onclick="exportData()">Export backup</button><button class="btn" style="flex:1;background:var(--card2);border:1px solid var(--border);color:var(--dim)" onclick="document.getElementById('import-file').click()">Import backup</button></div><input id="import-file" type="file" accept=".json" style="display:none" onchange="importData(this)"></div>`;
  return`<div class="ph" style="padding:22px 14px 14px">
    <div class="eyebrow" style="color:var(--full)">Your numbers</div>
    <h1>Progress</h1>
  </div>
  <div class="page">
    <div class="stat-grid" style="margin-bottom:9px">
      <div class="stat-box"><div class="val" style="color:var(--push)">${total}</div><div class="lbl">TOTAL</div></div>
      <div class="stat-box"><div class="val" style="color:var(--pull)">${thisWeek}</div><div class="lbl">This week</div></div>
      <div class="stat-box"><div class="val" style="color:var(--full)">${streak}</div><div class="lbl">Streak</div></div>
    </div>
    <div class="stat-grid" style="margin-bottom:11px">
      <div class="stat-box"><div class="val" style="color:var(--core)">${thisMonth}</div><div class="lbl">This month</div></div>
      <div class="stat-box"><div class="val" style="color:var(--legs)">${longestStreak}</div><div class="lbl">Best streak</div></div>
      <div class="stat-box"><div class="val" style="color:var(--cond);font-size:22px">${avgPerWeek}</div><div class="lbl">AVG/WEEK</div></div>
    </div>
    <div class="stat-grid" style="margin-bottom:11px">
      <div class="stat-box" style="flex:1"><div class="val" style="color:var(--pull);font-size:22px">${totalSets.toLocaleString()}</div><div class="lbl">Total sets</div></div>
      <div class="stat-box" style="flex:1"><div class="val" style="color:var(--push);font-size:22px">${totalReps.toLocaleString()}</div><div class="lbl">Total reps</div></div>
    </div>
    ${weightCard}
    <div onclick="ST.viewPBs=true;render()" style="background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:11px;cursor:pointer;display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:10px">
        
        <div>
          <div style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:16px">Track PBs</div>
          <div style="font-size:10px;color:var(--dim)">${Object.keys(ST.prs).length} logged · tap to view all</div>
        </div>
      </div>
      <span style="color:var(--dim);font-size:16px">›</span>
    </div>
    <div class="stat-grid-desktop">
      <div>${chart}${monthChart}</div>
      <div>${breakdown}${exFreqCard}</div>
    </div>
    ${prs}${recentList}${empty}${dataCard}
  </div>`;
}

/* ══════════════════════════════════════
   EXERCISE MODAL
══════════════════════════════════════ */
function showEx(id){
  const ex=getEx(id);if(!ex)return;
  const col=colOf(ex.c);
  const isW=!!ex.weighted;
  // Exercise history — merge logged workout sessions with quick-logged entries
  const sessionEntries=ST.hist.filter(h=>h.log&&h.log[id]&&h.log[id].length>0).map(h=>{
    if(isW){const best=h.log[id].reduce((a,b)=>(b.weight||0)>(a.weight||0)?b:a);return{date:h.date,best:best.weight,reps:best.reps,sets:h.log[id].length};}
    return{date:h.date,best:Math.max(...h.log[id].map(s=>s.reps)),sets:h.log[id].length};
  });
  const quickEntries=(ST.quickLogs[id]||[]).map(q=>isW?{date:q.date,best:q.weight,reps:q.reps,sets:0}:{date:q.date,best:q.reps,sets:0});
  const exHistory=[...sessionEntries,...quickEntries].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).slice(-10);
  const unitLabel=v=>isW?v+'kg':v+(ex.timed?'s':'');
  const histChart=(()=>{
    if(exHistory.length<2)return exHistory.length===1?`<div style="font-size:11px;color:var(--dim);margin-top:4px">1 session logged — ${unitLabel(exHistory[0].best)} best · keep going to see your trend</div>`:'<div style="font-size:11px;color:var(--dim);margin-top:4px">Log this exercise to see your progress over time</div>';
    const mx=Math.max(...exHistory.map(h=>h.best));
    const mn=Math.max(0,Math.min(...exHistory.map(h=>h.best))-2);
    const w=Math.max(exHistory.length*40,100);
    const pts=exHistory.map((h,i)=>`${i*(w/(exHistory.length-1))},${70-((h.best-mn)/(mx-mn||1))*60}`).join(' ');
    const dts=exHistory.map((h,i)=>`<circle cx="${i*(w/(exHistory.length-1))}" cy="${70-((h.best-mn)/(mx-mn||1))*60}" r="4" fill="${col}"/><text x="${i*(w/(exHistory.length-1))}" y="${70-((h.best-mn)/(mx-mn||1))*60-8}" text-anchor="middle" fill="${col}" font-size="10" font-family="Instrument Sans,sans-serif" font-weight="700">${unitLabel(h.best)}</text><text x="${i*(w/(exHistory.length-1))}" y="85" text-anchor="middle" fill="var(--dim)" font-size="8">${h.date.slice(5)}</text>`).join('');
    return`<div style="margin-top:10px"><div style="font-size:9px;letter-spacing:2px;color:${col};font-family:'Instrument Sans',sans-serif;font-weight:700;margin-bottom:6px">${isW?'HEAVIEST WEIGHT':'BEST '+(ex.timed?'HOLD':'REPS')} OVER TIME</div><svg width="100%" height="90" viewBox="0 0 ${w} 90"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-dasharray="4"/>${dts}</svg></div>`;
  })();
  const qlList=ST.quickLogs[id]||[];
  const qlRev=[...qlList].map((q,i)=>({...q,idx:i})).reverse();
  const qlHistRows=qlRev.map((q,i)=>{
    const last=i===qlRev.length-1;
    const bstyle=last?'':'border-bottom:1px solid var(--border);';
    const editing=ST.qlEditIdx&&ST.qlEditIdx.id===id&&ST.qlEditIdx.idx===q.idx;
    if(editing){
      return`<div style="display:flex;align-items:center;gap:7px;padding:7px 0;${bstyle}">
        ${isW?`<input id="ql-edit-weight-${id}" type="number" step="0.5" class="input" style="flex:1;font-size:15px;padding:8px 10px" value="${q.weight}" placeholder="kg" autocomplete="off">
        <input id="ql-edit-input-${id}" type="number" step="1" class="input" style="flex:1;font-size:15px;padding:8px 10px" value="${q.reps}" placeholder="reps" autocomplete="off">`:
        `<input id="ql-edit-input-${id}" type="number" step="0.1" class="input" style="flex:1;font-size:15px;padding:8px 10px" value="${q.reps}" autocomplete="off">`}
        <button onclick="saveQuickLogEdit('${id}',${q.idx})" style="background:#5E86A8;border:none;color:#000;border-radius:var(--r-sm);padding:8px 11px;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0">Save</button>
        <button onclick='ST.qlEditIdx=null;showEx("${id}")' style="background:transparent;border:1px solid var(--border);color:var(--dim);border-radius:var(--r-sm);padding:8px 11px;font-size:11px;cursor:pointer;flex-shrink:0">Cancel</button>
      </div>`;
    }
    return`<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;${bstyle}">
      <div>
        <span style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:15px">${isW?q.weight+'kg × '+q.reps:q.reps+(ex.timed?'s':' reps')}</span>
        <span style="font-size:10px;color:var(--dim);margin-left:8px">${q.date}</span>
      </div>
      <div style="display:flex;gap:2px">
        <button onclick='ST.qlEditIdx={id:"${id}",idx:${q.idx}};showEx("${id}")' style="background:transparent;border:none;color:var(--muted);cursor:pointer;padding:6px 8px;display:flex;align-items:center"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 3.5l3 3L6 17H3v-3L13.5 3.5z"/><path d="M11.5 5.5l3 3"/></svg></button>
        <button onclick="deleteQuickLog('${id}',${q.idx})" style="background:transparent;border:none;color:#B0524F;cursor:pointer;padding:6px 8px;display:flex;align-items:center"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12"/><path d="M8 6V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2"/><path d="M5 6l1 11a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-11"/><line x1="8.5" y1="9" x2="8.5" y2="14"/><line x1="11.5" y1="9" x2="11.5" y2="14"/></svg></button>
      </div>
    </div>`;
  }).join('');
  const quickLogCard=`<div class="card" style="margin-bottom:16px;border-color:${hex(col,0.3)};background:${hex(col,0.05)}">
    <div class="slabel">Quick log ${isW?'(KG × REPS)':ex.timed?'(SECONDS)':'(REPS)'}</div>
    <p style="font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.5">Log a ${isW?'heaviest lift':'max '+(ex.timed?'hold':'set')} any time — no workout needed. Counts toward your PR.</p>
    <div style="display:flex;gap:8px;align-items:center">
      ${isW?`<input id="ql-weight-${id}" type="number" step="0.5" class="input" style="flex:1;font-size:16px" placeholder="kg" autocomplete="off">
      <input id="ql-input-${id}" type="number" step="1" class="input" style="flex:1;font-size:16px" placeholder="reps" autocomplete="off">`:
      `<input id="ql-input-${id}" type="number" step="0.1" class="input" style="flex:1;font-size:16px" placeholder="${ex.timed?'e.g. 20':'e.g. 12'}" autocomplete="off">`}
      <button onclick="quickLogEx('${id}')" class="btn" style="flex:0 0 auto;width:auto;padding:11px 16px;background:${col}">SAVE</button>
    </div>
    ${qlList.length?`<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px">
      <div class="slabel" style="margin-bottom:2px">Log history</div>
      ${qlHistRows}
    </div>`:''}
  </div>`;
  const modal=document.getElementById('exmodal');
  modal.innerHTML=`<div class="modal-overlay" onclick="closeEx(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div style="flex:1">
          <div style="font-size:9px;letter-spacing:3px;color:${col};font-family:'Instrument Sans',sans-serif;font-weight:700;margin-bottom:3px">${ex.c.toUpperCase()} · ${ex.e||'None'}</div>
          <h2>${ex.n}</h2>
          <div style="display:flex;gap:6px;margin-top:7px;align-items:center;flex-wrap:wrap">
            ${dots(ex.d,4,col)}
            <span style="font-size:11px;color:var(--dim)">${LVL[ex.d]||'Beginner'}</span>
            <span style="background:${hex(col,0.15)};color:${col};border-radius:10px;padding:1px 7px;font-size:10px;font-family:'Barlow',sans-serif;font-weight:600">${ex.m}</span>
          </div>
          ${histChart}
        </div>
        <button class="close-btn" onclick="closeExBtn()">✕</button>
      </div>

function closeEx(e){if(e.target===e.currentTarget)closeExBtn();}
function closeExBtn(){document.getElementById('exmodal').style.display='none';}
function recalcPR(id){
  const ex=getEx(id);
  let best=null;
  if(ex&&ex.weighted){
    ST.hist.forEach(h=>{
      if(h.log&&h.log[id]&&h.log[id].length){
        const mx=h.log[id].reduce((a,b)=>(b.weight||0)>(a.weight||0)?b:a);
        if(best===null||mx.weight>best.weight)best={weight:mx.weight,reps:mx.reps,date:h.date};
      }
    });
    (ST.quickLogs[id]||[]).forEach(q=>{if(best===null||(q.weight||0)>best.weight)best={weight:q.weight,reps:q.reps,date:q.date};});
  }else{
    ST.hist.forEach(h=>{
      if(h.log&&h.log[id]&&h.log[id].length){
        const mx=Math.max(...h.log[id].map(s=>s.reps));
        if(best===null||mx>best.reps)best={reps:mx,date:h.date};
      }
    });
    (ST.quickLogs[id]||[]).forEach(q=>{if(best===null||q.reps>best.reps)best={reps:q.reps,date:q.date};});
  }
  if(best)ST.prs[id]=best;else delete ST.prs[id];
  sv('prs',ST.prs);
}
function quickLogEx(id){
  const ex=getEx(id);
  const inp=document.getElementById('ql-input-'+id);
  const v=parseFloat(inp?inp.value:'');
  if(!v||v<=0){alert('Enter a valid number');return;}
  if(!ST.quickLogs)ST.quickLogs={};
  if(!ST.quickLogs[id])ST.quickLogs[id]=[];
  if(ex&&ex.weighted){
    const wInp=document.getElementById('ql-weight-'+id);
    const w=parseFloat(wInp?wInp.value:'');
    if(!w||w<=0){alert('Enter the weight lifted');return;}
    ST.quickLogs[id].push({weight:w,reps:v,date:dkey()});
  }else{
    ST.quickLogs[id].push({reps:v,date:dkey()});
  }
  sv('quickLogs',ST.quickLogs);
  recalcPR(id);
  showEx(id);
}
function saveQuickLogEdit(id,idx){
  const ex=getEx(id);
  const inp=document.getElementById('ql-edit-input-'+id);
  const v=parseFloat(inp?inp.value:'');
  if(!v||v<=0){alert('Enter a valid number');return;}
  if(!ST.quickLogs[id]||!ST.quickLogs[id][idx])return;
  if(ex&&ex.weighted){
    const wInp=document.getElementById('ql-edit-weight-'+id);
    const w=parseFloat(wInp?wInp.value:'');
    if(!w||w<=0){alert('Enter the weight lifted');return;}
    ST.quickLogs[id][idx]={...ST.quickLogs[id][idx],weight:w,reps:v};
  }else{
    ST.quickLogs[id][idx]={...ST.quickLogs[id][idx],reps:v};
  }
  sv('quickLogs',ST.quickLogs);
  ST.qlEditIdx=null;
  recalcPR(id);
  showEx(id);
}
function deleteQuickLog(id,idx){
  if(!confirm('Delete this log entry?'))return;
  if(!ST.quickLogs[id])return;
  ST.quickLogs[id].splice(idx,1);
  sv('quickLogs',ST.quickLogs);
  if(ST.qlEditIdx&&ST.qlEditIdx.id===id&&ST.qlEditIdx.idx===idx)ST.qlEditIdx=null;
  recalcPR(id);
  showEx(id);
}

function pageSkills(){
  if(ST.viewSkill){
    const skill=SKILLS.find(s=>s.id===ST.viewSkill);
    if(skill)return renderSkillDetail(skill);
  }
  const cards=SKILLS.map(skill=>{
    const prog=ST.skillProgress[skill.id]||0;
    const isComplete=!!ST.skillComplete[skill.id];
    const cur=skill.progressions[prog];
    const pct=isComplete?100:Math.round((prog/skill.progressions.length)*100);
    const col=colOf(skill.c);
    const pbList=ST.skillPRs[skill.id]||[];
    const pb=pbList.length?pbList.reduce((a,b)=>b.value>a.value?b:a):null;
    const pbBadge=pb?`<div style="font-size:10px;color:#facc15;font-weight:700;margin-top:2px">PB: ${pb.value}${pb.unit==='secs'?'s':' reps'}</div>`:'';
    return`<div onclick="ST.viewSkill='${skill.id}';render()" style="background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color 0.15s" onmouseover="this.style.borderColor='var(--border2)'" onmouseout="this.style.borderColor='var(--border)'">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px">
        <div>
          <div style="font-size:9px;color:${col};letter-spacing:2px;font-weight:700;margin-bottom:3px">${skill.c.toUpperCase()} · ${skill.e}</div>
          <div style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:22px">${skill.n}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">${isComplete?'Completed ✓':`Step ${prog+1} of ${skill.progressions.length}: ${cur.n}`}</div>
          ${pbBadge}
        </div>
        <div style="text-align:right;flex-shrink:0;margin-left:12px">
          <div style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:26px;color:${col}">${pct}%</div>
          <div style="font-size:9px;color:var(--muted)">complete</div>
        </div>
      </div>
      <div class="prog-bar-wrap"><div class="prog-bar" style="background:${col};width:${pct}%"></div></div>
      ${isComplete?`<div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5">All progressions done — tap in to log or update your PB.</div>`:`<div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5">Target: <span style="color:${col};font-weight:600">${cur.target}</span> · ${cur.desc.slice(0,80)}...</div>`}
    </div>`;
  }).join('');
  return`<div class="ph" style="padding:24px 16px 14px">
    <div class="eyebrow" style="color:var(--legs)">Skill training</div>
    <h1>Skills</h1>
    <p>Progressive guides for L-Sit, Handstand, Front Lever and Planche. Tap a skill to see the full progression.</p>
  </div>
  <div class="page">${cards}</div>`;
}

function pagePBTracker(){
  const entries=Object.entries(ST.prs)
    .map(([id,pr])=>({id,pr,ex:getEx(id)}))
    .filter(e=>e.ex)
    .sort((a,b)=>b.pr.date<a.pr.date?-1:b.pr.date>a.pr.date?1:0);
  const cards=entries.map(({id,pr,ex})=>{
    const col=colOf(ex.c);
    const isW=!!ex.weighted;
    return`<div onclick="showEx('${id}')" style="background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px">
      <div style="flex:1;min-width:0">
        <div style="font-size:9px;color:${col};letter-spacing:2px;font-weight:700;margin-bottom:3px">${ex.c.toUpperCase()}${isW?' · WEIGHTED':ex.timed?' · TIMED':''}</div>
        <div style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ex.n}</div>
        <div style="font-size:10px;color:var(--dim);margin-top:1px">Set ${pr.date}</div>
      </div>
      <div style="text-align:right;flex-shrink:0;display:flex;align-items:center;gap:8px">
        <div>
          <div style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:24px;color:${col}">${isW?pr.weight+'kg':pr.reps+(ex.timed?'s':'')}</div>
          <div style="font-size:9px;color:var(--muted)">${isW?(pr.reps?'× '+pr.reps+' reps':''):ex.timed?'':'reps'}</div>
        </div>
        <span style="color:var(--dim);font-size:16px">›</span>
      </div>
    </div>`;
  }).join('');
  const empty=`<div style="text-align:center;padding:50px 20px">
    
    <p style="color:var(--dim);font-size:13px;line-height:1.7;margin-bottom:16px">No PBs logged yet. Open any exercise in your catalog and use Quick Log to set your first one.</p>
    <button class="btn" style="width:auto;padding:11px 20px;background:var(--pull)" onclick="ST.viewPBs=false;ST.tab='workouts';ST.wkSub='library';render()">Go to catalog</button>
  </div>`;
  return`<div class="track-header">
    <button class="back-btn" onclick="ST.viewPBs=false;render()">←</button>
    <div>
      <div style="font-size:9px;color:var(--core);letter-spacing:2px;font-weight:700">Goal setting</div>
      <div style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:22px">Track PBs</div>
    </div>
  </div>
  <div class="page" style="padding-top:14px">
    ${entries.length?cards:empty}
  </div>`;
}

function renderSkillDetail(skill){
  const col=colOf(skill.c);
  const curProg=ST.skillProgress[skill.id]||0;
  const isComplete=!!ST.skillComplete[skill.id];
  const progressions=skill.progressions.map((p,idx)=>{
    const done=isComplete?idx<=curProg:idx<curProg;
    const current=!isComplete&&idx===curProg;
    const locked=idx>curProg;
    const bc=done?'var(--border)':current?col:'var(--border)';
    const bg=done?'transparent':current?hex(col,0.06):'transparent';
    return`<div style="background:${bg};border:1px solid ${bc};border-radius:var(--r-lg);padding:14px;margin-bottom:8px;opacity:${locked?0.45:1}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${current?'12px':'0'}">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:28px;height:28px;border-radius:50%;background:${done?'rgba(52,211,153,0.15)':current?hex(col,0.15):'var(--card2)'};border:1px solid ${done?'#5E86A8':current?col:'var(--border)'};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:${done?'#5E86A8':current?col:'var(--dim)'};flex-shrink:0">${done?'✓':idx+1}</div>
          <div>
            <div style="font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:16px;color:${locked?'var(--muted)':'var(--text)'}">${p.n}</div>
            <div style="font-size:11px;color:${current?col:'var(--muted)'};font-weight:600">Target: ${p.target}</div>
          </div>
        </div>
        ${current?`<button onclick="skillMarkDone('${skill.id}',${idx})" style="background:${col};border:none;color:#fff;border-radius:var(--r-sm);padding:7px 14px;font-weight:700;font-size:12px;cursor:pointer;flex-shrink:0">Mark Done</button>`:''}

      <div style="display:flex;gap:2px">
        <button onclick='ST.skillPBEditIdx={skillId:"${skill.id}",idx:${p.idx}};render()' style="background:transparent;border:none;color:var(--muted);cursor:pointer;padding:6px 8px;display:flex;align-items:center"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 3.5l3 3L6 17H3v-3L13.5 3.5z"/><path d="M11.5 5.5l3 3"/></svg></button>

function skillMarkDone(skillId,idx){
  if(!ST.skillProgress)ST.skillProgress={};
  if(!ST.skillComplete)ST.skillComplete={};
  const skill=SKILLS.find(s=>s.id===skillId);
  if(!skill)return;
  if(idx<skill.progressions.length-1){
    ST.skillProgress[skillId]=idx+1;
  }else{
    ST.skillComplete[skillId]=true;
  }
  sv('skillProgress',ST.skillProgress);
  sv('skillComplete',ST.skillComplete);
  render();
}
function skillReset(skillId,idx){
  if(!ST.skillProgress)ST.skillProgress={};
  if(!ST.skillComplete)ST.skillComplete={};
  ST.skillComplete[skillId]=false;
  ST.skillProgress[skillId]=idx;
  sv('skillProgress',ST.skillProgress);
  sv('skillComplete',ST.skillComplete);
  render();
}
function saveSkillPB(skillId){
  const inp=document.getElementById('pb-input-'+skillId);
  const unitEl=document.getElementById('pb-unit-'+skillId);
  const v=parseFloat(inp?inp.value:'');
  if(!v||v<=0){alert('Enter a valid number');return;}
  if(!ST.skillPRs)ST.skillPRs={};
  if(!ST.skillPRs[skillId])ST.skillPRs[skillId]=[];
  ST.skillPRs[skillId].push({value:v,unit:unitEl?unitEl.value:'secs',date:dkey()});
  sv('skillPRs',ST.skillPRs);
  render();
}
function saveSkillPBEdit(skillId,idx){
  const inp=document.getElementById('pb-edit-input-'+skillId);
  const unitEl=document.getElementById('pb-edit-unit-'+skillId);
  const v=parseFloat(inp?inp.value:'');
  if(!v||v<=0){alert('Enter a valid number');return;}
  if(!ST.skillPRs[skillId]||!ST.skillPRs[skillId][idx])return;
  ST.skillPRs[skillId][idx]={...ST.skillPRs[skillId][idx],value:v,unit:unitEl?unitEl.value:'secs'};
  sv('skillPRs',ST.skillPRs);
  ST.skillPBEditIdx=null;
  render();
}
function deleteSkillPB(skillId,idx){
  if(!confirm('Delete this PB entry?'))return;
  if(!ST.skillPRs[skillId])return;
  ST.skillPRs[skillId].splice(idx,1);
  sv('skillPRs',ST.skillPRs);
  if(ST.skillPBEditIdx&&ST.skillPBEditIdx.skillId===skillId&&ST.skillPBEditIdx.idx===idx)ST.skillPBEditIdx=null;
  render();
}

function streakCount(){
  const h=ST.hist;if(!h.length)return 0;
  const ds=[...new Set(h.map(x=>x.date))].sort().reverse();
  let s=0,dt=new Date();
  for(const date of ds){const diff=Math.round((dt-new Date(date))/86400000);if(diff<=1){s++;dt=new Date(date);}else break;}
  return s;
}

function render(keepScroll){
  document.getElementById('nav').dataset.tab = navGroup();
  const pg = document.getElementById('page');
  const scrollY = keepScroll ? pg.scrollTop : 0;
  let html = '';
  const _t=ST.tab;
  const _live=ST.trPhase&&ST.trPhase!=='select';
  if(_t==='plan'||_t==='schedule') html='<div class="track-header"><button class="back-btn" onclick="goTab(\'today\')">←</button><div style="font-size:14.5px;font-weight:600">Back to today</div></div>'+pageSchedule();
  else if(_t==='train'||_t==='workouts') html=pageWorkouts();
  else if(_t==='progress'||_t==='stats') html=pageStats();
  else html=_live?pageTrack():pageToday();
  pg.innerHTML = html;
  if(!keepScroll){
    if(pg.scrollTo) pg.scrollTo(0,0);
    window.scrollTo(0,0);
  } else {
    pg.scrollTop = scrollY;
  }
}

function goTab(t){
  if(t==='schedule')t='plan';
  if(t==='workouts')t='train';
  if(t==='stats')t='progress';
  if(t==='track')t='today';
  ST.tab=t;ST.editing=-1;ST.viewProg=null;ST.viewPBs=false;ST.viewSkill=null;render();
}
function togglePresets(){ST.showPresets=!ST.showPresets;render();}
function saveSchedPreset(){
  const name=prompt('Name this week preset (e.g. "Phase 1 — No Bands"):');

  ST.schedPresets.push({name:name.trim(),sched:ST.sched.map(d=>({...d}))});

}
function loadSchedPreset(i){

  if(!confirm('Load "'+p.name+'"? This will replace your current week.'))return;
  ST.sched=p.sched.map(d=>({...d}));

function deleteSchedPreset(i){

  sv('sched',ST.sched);
  ST.editing=-1;
  render();
}
function toggleEdit(i){ST.editing=ST.editing===i?-1:i;render();}
function schedCat(c){ST.schedFilter=c;render();}
function pickTime(i,t){ST.sched[i].t=t;sv('sched',ST.sched);render();}
function pickProg(i,pid){ST.sched[i].pid=pid;sv('sched',ST.sched);ST.editing=-1;render();}
function pickCat(i,cat){
  ST.sched[i].cat=cat;

  ST.sched[i].pid=cat?(RECO[cat]||PROG.find(p=>p.c===cat)?.id||''):'';

function pickProgForDay(i,pid){
  ST.sched[i].pid=pid;

function progsForMode(){

function trLogSet(){
  const inp=document.getElementById('reps-input');
  const manualVal=parseInt(inp?inp.value:ST.trReps)||0;
  const reps=manualVal||trHoldSecs||0;
  if(reps<1)return;
  trClearHoldTimer();
  const p=ST.trProg;
  const isCustom=!!p.custom;
  const exs=isCustom?p.exs||[]:getOpt(p,ST.trTime)?getOpt(p,ST.trTime).ex:[];
  const curE=exs[ST.trExIdx];
  if(!curE)return;
  const id=curE.id;
  const ex=getEx(id);
  const totalSets=curE.s||3;
  if(!ST.trLog[id])ST.trLog[id]=[];
  if(ex&&ex.weighted){
    const wInp=document.getElementById('weight-input');
    const weight=parseFloat(wInp?wInp.value:ST.trWeight)||0;
    if(weight<=0){alert('Enter the weight you lifted');return;}
    ST.trLog[id].push({reps,weight,rpe:ST.trRpe});
  }else{
    ST.trLog[id].push({reps,rpe:ST.trRpe});
  }
  ST.trReps='';ST.trRpe=2;
  // keep the weight prefilled — you rarely change it between sets
  if(ST.trSetIdx+1>=totalSets){
    if(ST.trExIdx+1>=exs.length){trFinish();return;}
    else{startRestTimer();ST.trExIdx++;ST.trSetIdx=0;ST.trWeight='';}
  }else{startRestTimer();ST.trSetIdx++;}
  saveActiveWorkout();
  render();
}
function trSkipSet(){
  const p=ST.trProg;
  const isCustom=!!p.custom;
  const exs=isCustom?p.exs||[]:getOpt(p,ST.trTime)?getOpt(p,ST.trTime).ex:[];
  const curE=exs[ST.trExIdx];
  const totalSets=curE?curE.s||3:3;
  if(ST.trSetIdx+1>=totalSets){
    if(ST.trExIdx+1>=exs.length){trFinish();return;}
    else{startRestTimer();ST.trExIdx++;ST.trSetIdx=0;ST.trWeight='';}

}

function trFinish(){
  clearInterval(restTimer);clearInterval(workoutClock);clearActiveWorkout();ST.restSecs=null;
  const dur=ST.trStart?Math.round((Date.now()-ST.trStart)/60000):0;
  const newPrs={...ST.prs};
  Object.entries(ST.trLog).forEach(([id,sets])=>{
    const ex=getEx(id);
    if(ex&&ex.weighted){
      const best=sets.reduce((a,b)=>(b.weight||0)>(a.weight||0)?b:a);
      if(!newPrs[id]||best.weight>(newPrs[id].weight||0))newPrs[id]={weight:best.weight,reps:best.reps,date:dkey()};
    }else{
      const mx=Math.max(...sets.map(s=>s.reps));
      if(!newPrs[id]||mx>newPrs[id].reps)newPrs[id]={reps:mx,date:dkey()};
    }
  });
  ST.prs=newPrs;sv('prs',newPrs);
  const entry={date:dkey(),wk:ST.trProg?ST.trProg.n:'Workout',pid:ST.trProg?ST.trProg.id:'',log:ST.trLog,notes:ST.trNotes,dur};
  ST.hist.push(entry);sv('hist',ST.hist);
  ST.trPhase='done';render();
  setTimeout(()=>{ST.tab='stats';},1500);
}

function doSessionSwap(oldId,newId){
  if(ST.viewSession===null)return;
  const sess=ST.hist[ST.viewSession];
  if(!sess||!sess.log||!sess.log[oldId])return;
  // rebuild the log preserving order, renaming the key in place
  const rebuilt={};
  Object.entries(sess.log).forEach(([k,v])=>{
    if(k===oldId)rebuilt[newId]=(rebuilt[newId]||[]).concat(v);
    else rebuilt[k]=(rebuilt[k]||[]).concat(v);
  });
  sess.log=rebuilt;
  sv('hist',ST.hist);
  recalcPR(oldId); recalcPR(newId);
  closeExBtn();
  render();
}
function editSessionSet(exId,setIdx,val,field){
  if(ST.viewSession===null)return;
  const sess=ST.hist[ST.viewSession];
  if(!sess||!sess.log||!sess.log[exId]||!sess.log[exId][setIdx])return;
  sess.log[exId][setIdx][field||'reps']=val;
}
function saveSessionEdit(){
  sv('hist',ST.hist);
  // PRs may have changed if weights or reps were corrected
  const sess=ST.hist[ST.viewSession];
  if(sess&&sess.log)Object.keys(sess.log).forEach(id=>recalcPR(id));
  ST.editingSession=false;
  render();
}
function shareSession(idx){
  const sess=ST.hist[idx];
  if(!sess)return;
  const text=exportWorkoutText(sess.log,sess.wk||'Workout',sess.date,sess.dur||0,sess.notes||'');
  copyExport(text);
}

// Export / Import
function exportData(){
  const data={
    version:1,
    exported:dkey(),
    schedule:ST.sched,
    history:ST.hist,
    prs:ST.prs,
    customs:ST.customs,
    editedProgs:ST.editedProgs,
    weights:ST.weights,
    skillProgress:ST.skillProgress,
    skillComplete:ST.skillComplete,
    skillPRs:ST.skillPRs,
    quickLogs:ST.quickLogs,
    trainMode:ST.trainMode,
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`overload-backup-${dkey()}.json`;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
}
function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(data.version!==1)throw new Error('Unknown format');
      if(!confirm(`Import data from ${data.exported}? This will overwrite your current data.`))return;
      if(data.schedule){ST.sched=data.schedule;sv('sched',ST.sched);}
      if(data.history){ST.hist=data.history;sv('hist',ST.hist);}
      if(data.prs){ST.prs=data.prs;sv('prs',ST.prs);}
      if(data.customs){ST.customs=data.customs;sv('customs',ST.customs);}
      if(data.editedProgs){ST.editedProgs=data.editedProgs;sv('editedProgs',ST.editedProgs);}
      if(data.weights){ST.weights=data.weights;sv('weights',ST.weights);}
      if(data.skillProgress){ST.skillProgress=data.skillProgress;sv('skillProgress',ST.skillProgress);}
      if(data.skillComplete){ST.skillComplete=data.skillComplete;sv('skillComplete',ST.skillComplete);}
      if(data.skillPRs){ST.skillPRs=data.skillPRs;sv('skillPRs',ST.skillPRs);}
      if(data.quickLogs){ST.quickLogs=data.quickLogs;sv('quickLogs',ST.quickLogs);}
      if(data.trainMode){ST.trainMode=data.trainMode;sv('trainMode',ST.trainMode);}
      alert('Data imported successfully!');
      render();
    }catch(err){alert('Import failed — make sure you are using a valid backup file.');}
  };
  reader.readAsText(file);
  input.value='';
}
